name: desktop

# Builds the Electron desktop installers: macOS dmg (arm64 + x64), Windows nsis (x64),
# Linux AppImage + deb (x64 + arm64). Each job stages the server runtime (sources +
# @deepseek-ai/dsh + official MCP Memory + Node) into extraResources/app-runtime.
# Manual or on a `desktop-v*` tag only — never on PRs, so PR CI stays fast.
# No secrets, no notarization:
# - macOS is ad-hoc signed (`mac.identity: "-"`), so Apple Silicon opens it instead of "damaged".
# - Windows is signed with a self-signed cert minted in this job; its private key never leaves the runner.
# - Linux packages are unsigned.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            arch: arm64
            platform: darwin
          - os: macos-15-intel
            target: mac
            arch: x64
            platform: darwin
          - os: windows-latest
            target: win
            arch: x64
            platform: win32
          - os: ubuntu-latest
            target: linux
            arch: x64
            platform: linux
          - os: ubuntu-24.04-arm
            target: linux
            arch: arm64
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-fund --no-audit

      - name: Stage app runtime
        run: node scripts/bundle-app-runtime.mjs --out resources/app-runtime

      - name: Self-signed code-signing cert (Windows, per build)
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $pass = [guid]::NewGuid().ToString('N')
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Douya (self-signed)' `
            -KeyUsage DigitalSignature -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(2)
          $pfx = Join-Path $env:RUNNER_TEMP 'douya-selfsigned.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $pass -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath dist-cert.cer | Out-Null
          echo "::add-mask::$pass"
          "CSC_LINK=$pfx" >> $env:GITHUB_ENV
          "CSC_KEY_PASSWORD=$pass" >> $env:GITHUB_ENV

      - name: Build installer
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never

      - name: Check signatures
        if: matrix.target != 'linux'
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = mac ]; then
            app=$(ls -d dist/mac*/Douya.app | head -1)
            codesign --force --deep --sign - --timestamp=none "$app"
            codesign --verify --deep --strict "$app" && codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier|Format'
          else
            pwsh -c 'Get-ChildItem dist/*.exe, dist/win-unpacked/Douya.exe | Get-AuthenticodeSignature | Format-Table Status, @{n="Signer";e={$_.SignerCertificate.Subject}}, Path -AutoSize | Out-String -Width 200'
            mv dist-cert.cer dist/Douya-selfsigned.cer
          fi

      - name: Checksum installers
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto"), path = require("path");
            const dist = "dist";
            const files = fs.readdirSync(dist).filter((f) => /\.(dmg|exe|cer|AppImage|deb)$/.test(f)).sort();
            if (!files.length) throw new Error("no installer artifacts to checksum");
            const lines = files.map((f) => {
              const h = crypto.createHash("sha256").update(fs.readFileSync(path.join(dist, f))).digest("hex");
              return h + "  " + f;
            });
            fs.writeFileSync(path.join(dist, "SHA256SUMS"), lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          '

      - uses: actions/upload-artifact@v4
        with:
          name: douya-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.cer
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/SHA256SUMS
          if-no-files-found: error
