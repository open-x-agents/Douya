name: pr-guard

# 合并队列准入：一个 PR 凭什么有资格排队。
# 规则在 scripts/enqueue-guard.mjs 里，这一层只负责在 PR 上把它跑出来。
#
# 脚本从 **base 分支** 取，不在 PR 的 head 上跑：否则一个 PR 只要改掉守卫本身，
# 就能给自己放行，那叫评审，不叫准入。
#
# 这个 job 和 `tests`/`merge-tree` 由同一个事件同批启动，所以脚本不会一上来就评估：
# waitForChecks() 按同一 sha 的真实 check 状态轮询到两者都 completed（带超时）再判。
# 等待窗口由 GUARD_CHECK_TIMEOUT_MS 决定；窗口比 job timeout 短，超时是「没结论」，不是「红」。
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  # 拒绝理由要写进本 job 那条 `guard` check 的 output summary：PR 页面上直接可读。
  checks: write
  issues: read

concurrency:
  group: pr-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    # 比等待窗口（15 分钟）长，给 checkout 与 API 留余量；脚本自己会先收手。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 等 tests/merge-tree 都 completed，再评估准入
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 15 分钟等齐，15 秒读一次真实状态：不靠猜时间，到点没齐就报「没结论」。
          GUARD_CHECK_TIMEOUT_MS: '900000'
          GUARD_POLL_INTERVAL_MS: '15000'
        run: node scripts/enqueue-guard.mjs --pr ${{ github.event.pull_request.number }}
