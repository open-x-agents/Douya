name: pr-guard

# 合并队列准入：一个 PR 凭什么有资格排队。
# 规则在 scripts/enqueue-guard.mjs 里，这一层只负责在 PR 上把它跑出来。
#
# 脚本从 **base 分支** 取，不在 PR 的 head 上跑：否则一个 PR 只要改掉守卫本身，
# 就能给自己放行，那叫评审，不叫准入。
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read
  issues: read

concurrency:
  group: pr-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 准入检查
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/enqueue-guard.mjs --pr ${{ github.event.pull_request.number }}
