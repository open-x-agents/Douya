name: release

# 每天一个版本，由机器发，不由人点。
# 02:00 Asia/Shanghai（UTC 前一天 18:00）。GitHub 的定时任务会迟到，迟到只影响 tag
# 打出来的时刻，不影响内容：它发的还是当天 main 上的东西。
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 发版前的三道闸：单元测试、干净安装、真实模型 e2e。
      # 版本号这一项在 Release 步骤写完之后自检（那时它才存在）。
      # 缺 MODEL_API_KEY 时这一步失败，当天不发版本 —— 这道闸没有 key 就等于没有。
      - name: Pre-release 预检
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_BASE_URL: ${{ secrets.MODEL_BASE_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
        run: node scripts/pre-release.mjs --skip-version

      # 第二道闸：没有新提交就不发版本。空版本会让“每天有进展”变成一句假话。
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node .github/scripts/release.mjs
