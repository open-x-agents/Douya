<style>
  :root{
    --ink:#15171c; --ink2:#4a4f5a; --ink3:#8b909c;
    --bg:#f4f2ee; --card:#ffffff; --line:#e8e6e1;
    --blue:#4a6cf7; --blue-soft:#eef2ff; --blue-line:#dbe3ff;
    --green:#2f9e6b; --green-soft:#eaf7f0;
    --amber:#c8862a; --amber-soft:#fdf4e6;
    --red:#c0392b; --red-soft:#fdeceb;
    --gray-soft:#f4f3f0;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    background:#fafafa;
    color:var(--ink);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  code{font:12px/1.5 ui-monospace,Menlo,monospace;background:#ecebe7;padding:1px 5px;border-radius:4px}

  .app{display:grid;grid-template-columns:200px 1fr;height:100vh;width:100vw}
  @media (max-width:760px){.app{grid-template-columns:1fr}.side{display:none}}

  .side{background:#f8f7f4;border-right:1px solid var(--line);padding:16px 12px;font-size:13px;overflow-y:auto}
  .side .who{display:flex;align-items:center;gap:8px;padding:4px 8px 16px}
  .side .who img{width:24px;height:24px}
  .side .who b{font-size:14px;font-weight:600}
  .nav{padding:8px 12px;border-radius:8px;color:var(--ink2);margin-bottom:2px;transition:.25s var(--ease);cursor:pointer}
  .nav:hover{background:rgba(255,255,255,.5)}
  .nav.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(21,23,28,.07)}
  .side .grp{font-size:10.5px;color:#a8acb5;letter-spacing:.08em;padding:16px 12px 6px;text-transform:uppercase}

  .views{position:relative;overflow:hidden;background:#fff}
  .view{position:absolute;inset:0;overflow-y:auto;padding:32px 40px 40px;opacity:0;visibility:hidden;transition:opacity .34s var(--ease),transform .34s var(--ease);transform:translateY(8px)}
  .view.on{opacity:1;visibility:visible;transform:none}
  @media (max-width:620px){.view{padding:20px 16px 24px}}

  .a{opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
  .a.in{opacity:1;transform:none}

  .concl{font-size:23px;line-height:1.45;letter-spacing:-.015em;margin:0 0 8px;font-weight:600;min-height:2.9em}
  @media (max-width:620px){.concl{font-size:19px}}
  .stamp{font-size:11.5px;color:var(--ink3);margin-bottom:18px;line-height:1.7}
  .stamp b{color:var(--amber);font-weight:600}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px}
  .stat b{display:block;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.3}
  .stat span{font-size:11.5px;color:var(--ink3)}

  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:15px;font-weight:600}
  .card p{margin:0;font-size:13px;color:var(--ink2);line-height:1.6}
  .card .meta{font-size:11.5px;color:var(--ink3);margin-top:8px}
  .card .actions{display:flex;gap:8px;margin-top:12px}
  
  /* Windows 8 style tile grid with glassmorphism */
  body{background:linear-gradient(135deg,#f5f7fa 0%,#e3e8f0 100%);min-height:100vh}
  
  .cards-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    grid-auto-rows:minmax(200px, auto);
    grid-auto-flow:dense;
    gap:16px;
    margin-top:24px;
    padding-bottom:100px;
  }
  @media (max-width:1200px){.cards-grid{grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));grid-auto-rows:minmax(180px, auto)}}
  @media (max-width:760px){.cards-grid{grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));grid-auto-rows:minmax(160px, auto)}}
  @media (max-width:480px){.cards-grid{grid-template-columns:1fr 1fr;grid-auto-rows:minmax(140px, auto);gap:12px}}
  
  .tile{
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(12px) saturate(180%);
    border-radius:16px;
    padding:18px;
    transition:.28s cubic-bezier(0.4, 0, 0.2, 1);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    border:1px solid rgba(255,255,255,.6);
    box-shadow:0 4px 16px rgba(21,23,28,.08),inset 0 1px 0 rgba(255,255,255,.8);
  }
  .tile:hover{transform:translateY(-3px) scale(1.01);box-shadow:0 12px 28px rgba(21,23,28,.15),inset 0 1px 0 rgba(255,255,255,.9)}
  
  /* Tile sizes */
  .tile.small{grid-column:span 1;grid-row:span 1}
  .tile.normal{grid-column:span 1;grid-row:span 1}
  .tile.wide{grid-column:span 2;grid-row:span 1}
  .tile.large{grid-column:span 2;grid-row:span 2}
  @media (max-width:480px){
    .tile.wide{grid-column:span 2}
    .tile.large{grid-column:span 2;grid-row:span 2}
  }
  
  /* Glassmorphism tile colors by type */
  .tile.hero{
    background:linear-gradient(135deg,rgba(74,108,247,.95) 0%,rgba(61,92,232,.95) 100%);
    backdrop-filter:blur(16px) saturate(180%);
    color:#fff;
    border-color:rgba(255,255,255,.3);
    box-shadow:0 8px 32px rgba(74,108,247,.25),inset 0 1px 0 rgba(255,255,255,.4);
  }
  .tile.hero *{color:#fff}
  
  .tile.timetable{
    background:linear-gradient(135deg,rgba(47,158,107,.92) 0%,rgba(39,132,90,.92) 100%);
    backdrop-filter:blur(16px) saturate(180%);
    color:#fff;
    border-color:rgba(255,255,255,.3);
    box-shadow:0 8px 32px rgba(47,158,107,.25),inset 0 1px 0 rgba(255,255,255,.4);
  }
  .tile.timetable *{color:#fff}
  
  .tile.project-cluster{
    background:linear-gradient(135deg,rgba(238,242,255,.95) 0%,rgba(224,231,255,.95) 100%);
    backdrop-filter:blur(12px) saturate(180%);
    border-color:rgba(74,108,247,.2);
    box-shadow:0 4px 16px rgba(74,108,247,.1),inset 0 1px 0 rgba(255,255,255,.9);
  }
  
  .tile.email-cluster,
  .tile.email-categories{
    background:linear-gradient(135deg,rgba(253,244,230,.95) 0%,rgba(249,234,209,.95) 100%);
    backdrop-filter:blur(12px) saturate(180%);
    border-color:rgba(255,166,0,.2);
    box-shadow:0 4px 16px rgba(255,166,0,.1),inset 0 1px 0 rgba(255,255,255,.9);
  }
  
  .tile.calendar-cluster{
    background:linear-gradient(135deg,rgba(234,247,240,.95) 0%,rgba(213,239,226,.95) 100%);
    backdrop-filter:blur(12px) saturate(180%);
    border-color:rgba(47,158,107,.2);
    box-shadow:0 4px 16px rgba(47,158,107,.1),inset 0 1px 0 rgba(255,255,255,.9);
  }
  
  .tile.newsletter-cluster{
    background:rgba(250,250,252,.95);
    backdrop-filter:blur(12px) saturate(180%);
    border-color:rgba(0,0,0,.08);
  }
  
  .tile.achievements-tile{
    background:linear-gradient(135deg,rgba(138,43,226,.92) 0%,rgba(106,27,154,.92) 100%);
    backdrop-filter:blur(16px) saturate(180%);
    color:#fff;
    border-color:rgba(255,255,255,.3);
    box-shadow:0 8px 32px rgba(138,43,226,.25),inset 0 1px 0 rgba(255,255,255,.4);
  }
  .tile.achievements-tile *{color:#fff}
  
  .tile.urgent{border-color:rgba(239,68,68,.6);border-width:2px;box-shadow:0 0 0 3px rgba(239,68,68,.1),0 4px 16px rgba(239,68,68,.2)}
  
  .tile-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px}
  .tile-title{font-size:15.5px;font-weight:700;letter-spacing:-.015em;line-height:1.3;margin:0;word-break:break-word}
  .tile-subtitle{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;margin:2px 0 6px;font-weight:700;opacity:.8}
  .tile-body{font-size:13px;line-height:1.55;opacity:.9;margin:4px 0 8px;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
  
  /* Visual blocks in tiles */
  .tile-blocks{display:flex;flex-direction:column;gap:10px;margin:10px 0;flex:1;min-height:0}
  
  /* Stat blocks */
  .tile-blocks .stat-block{display:flex;align-items:baseline;gap:4px}
  .tile-blocks .stat-block .value{font-size:28px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .tile-blocks .stat-block .label{font-size:11px;color:var(--ink3);font-weight:600;opacity:.85}
  
  /* Stat row (colored stats) */
  .stat-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .stat-row-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
  .stat-row-item .value{font-size:20px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .stat-row-item .label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
  
  /* Achievement rings */
  .achievement-rings{display:flex;gap:16px;align-items:center;justify-content:center;margin:12px 0}
  .achievement-ring{display:flex;flex-direction:column;align-items:center;gap:6px}
  .achievement-ring svg{width:64px;height:64px}
  .achievement-ring .label{font-size:10px;font-weight:600;text-align:center;opacity:.9;line-height:1.3}
  
  /* Sparkline */
  .sparkline-container{display:flex;flex-direction:column;gap:4px}
  .sparkline-container .label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.75}
  .sparkline-container svg{width:100%;height:32px}
  
  /* Avatar stack */
  .avatars{display:flex;align-items:center}
  .avatars .avatar{width:28px;height:28px;border-radius:50%;border:2px solid #fff;margin-left:-8px;overflow:hidden;background:var(--gray-soft)}
  .avatars .avatar:first-child{margin-left:0}
  .avatars .avatar img{width:100%;height:100%;object-fit:cover}
  
  /* Link list */
  .link-list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
  .link-list-item{font-size:11.5px;line-height:1.4;padding:6px 8px;background:rgba(255,255,255,.4);border-radius:6px;
    text-decoration:none;color:inherit;transition:.2s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid rgba(0,0,0,.08)}
  .link-list-item:hover{background:rgba(255,255,255,.7);transform:translateX(2px)}
  
  .tile-blocks .tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
  .tile-blocks .tag{font-size:10px;padding:3px 8px;border-radius:999px;font-weight:600;letter-spacing:.03em;white-space:nowrap;flex-shrink:0}
  .tile-blocks .tag.blue{background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue-line)}
  .tile-blocks .tag.red{background:var(--red-soft);color:var(--red);border:1px solid var(--red)}
  .tile-blocks .tag.green{background:var(--green-soft);color:var(--green);border:1px solid var(--green)}
  .tile-blocks .tag.orange{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber)}
  .tile-blocks .tag.gray{background:var(--gray-soft);color:var(--ink3);border:1px solid var(--line)}
  
  /* Charts in tiles */
  .tile-chart{width:100%;height:50px;margin:6px 0}
  .tile-chart svg{width:100%;height:100%}
  
  /* Donut chart */
  .donut-chart{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0}
  .donut-chart svg{width:60px;height:60px;flex-shrink:0}
  .donut-legend{display:flex;flex-direction:column;gap:4px;font-size:11px}
  .donut-legend-item{display:flex;align-items:center;gap:6px}
  .donut-legend-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  
  /* Timeline in tiles */
  .tile-timeline{display:flex;flex-direction:column;gap:6px;margin:8px 0;font-size:11.5px}
  .timeline-event{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center}
  .timeline-event .time{font-weight:700;font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace;color:var(--ink)}
  .timeline-event .event-title{line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  
  /* Timetable strip (24h horizontal) */
  .timetable-strip{
    display:flex;
    height:48px;
    border-radius:8px;
    overflow:hidden;
    margin:10px 0;
    position:relative;
    background:rgba(255,255,255,.15);
    box-shadow:inset 0 2px 8px rgba(0,0,0,.1);
  }
  .timetable-block{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9.5px;
    font-weight:700;
    color:rgba(255,255,255,.95);
    border-right:1px solid rgba(255,255,255,.2);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    padding:0 6px;
    text-align:center;
    line-height:1.2;
  }
  .timetable-block.fixed{
    background:rgba(255,255,255,.35);
    box-shadow:inset 0 1px 3px rgba(0,0,0,.1);
  }
  .timetable-block.suggested{
    background:rgba(255,255,255,.12);
    font-style:italic;
    opacity:.85;
  }
  .timetable-block:last-child{border-right:none}
  .timetable-now{
    position:absolute;
    top:-2px;
    bottom:-2px;
    width:3px;
    background:#fff;
    box-shadow:0 0 6px rgba(255,255,255,.9),0 0 12px rgba(255,255,255,.5);
    z-index:10;
    border-radius:999px;
  }
  .timetable-now::before{
    content:'';
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:8px;
    height:8px;
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 8px rgba(255,255,255,.9);
  }
  
  /* Tile actions - always at bottom */
  .tile-actions{display:flex;gap:6px;margin-top:auto;padding-top:12px;flex-shrink:0}
  .tile-action{border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.5);border-radius:6px;padding:6px 12px;font-size:11.5px;
    font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
  .tile-action:hover{background:rgba(255,255,255,.8);transform:translateY(-1px)}
  .tile.hero .tile-action,
  .tile.timetable .tile-action{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.2);color:#fff}
  .tile.hero .tile-action:hover,
  .tile.timetable .tile-action:hover{background:rgba(255,255,255,.35)}
  
  /* Bottom input for chat */
  .today-chat-input{
    position:sticky;
    bottom:0;
    left:0;
    right:0;
    padding:16px;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    margin:24px -40px -40px;
  }
  @media (max-width:620px){.today-chat-input{margin:16px -16px -24px;padding:12px 16px}}
  
  .today-chat-input .input-wrap{
    max-width:720px;
    margin:0 auto;
    display:flex;
    gap:10px;
    align-items:center;
    background:#fff;
    border:2px solid var(--line);
    border-radius:12px;
    padding:4px 4px 4px 16px;
    transition:.25s var(--ease);
  }
  .today-chat-input .input-wrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
  
  .today-chat-input input{
    flex:1;
    border:0;
    outline:none;
    font:inherit;
    font-size:14px;
    padding:10px 0;
    color:var(--ink);
    background:none;
    min-width:0;
  }
  .today-chat-input input::placeholder{color:var(--ink3)}
  
  .today-chat-input .send-btn{
    width:40px;
    height:40px;
    border-radius:8px;
    background:var(--blue);
    color:#fff;
    border:0;
    font-size:18px;
    cursor:pointer;
    display:grid;
    place-items:center;
    flex-shrink:0;
    transition:.2s var(--ease);
  }
  .today-chat-input .send-btn:hover{background:var(--blue);transform:scale(1.05)}
  .today-chat-input .send-btn:active{transform:scale(.95)}
  
  /* Tile zoom modal overlay */
  .tile-zoom-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(8px);
    z-index:2000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:40px;
    animation:fadeIn .2s ease;
  }
  .tile-zoom-overlay.open{display:flex}
  
  .tile-zoom-modal{
    background:rgba(255,255,255,.98);
    border-radius:20px;
    width:90%;
    max-width:900px;
    max-height:90vh;
    overflow:auto;
    padding:32px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
    position:relative;
    animation:zoomIn .3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  @keyframes fadeIn{from{opacity:0}}
  @keyframes zoomIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  
  .tile-zoom-close{z-index:5;
    position:absolute;
    top:20px;
    right:20px;
    width:36px;
    height:36px;

    cursor:pointer;
    display:grid;
    place-items:center;
    transition:.2s;
  }
  .tile-zoom-close:hover{background:var(--line)}
  
  .tile-zoom-header{
    margin-bottom:24px;
    padding-bottom:16px;
    border-bottom:2px solid var(--line);
  }
  .tile-zoom-title{font-size:24px;font-weight:800;margin:0 0 8px;color:var(--ink)}
  .tile-zoom-subtitle{font-size:14px;color:var(--ink3);margin:0}
  
  .tile-zoom-content{
    display:grid;
    gap:24px;
  }
  
  .tile-zoom-section{
    background:var(--gray-soft);
    border-radius:12px;
    padding:20px;
  }
  .tile-zoom-section h3{margin:0 0 12px;font-size:16px;font-weight:700;color:var(--ink)}
  
  .tile-zoom-items{display:flex;flex-direction:column;gap:12px}
  .tile-zoom-item{
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .tile-zoom-item-content{flex:1;min-width:0}
  .tile-zoom-item-title{font-size:14px;font-weight:600;margin:0 0 4px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile-zoom-item-meta{font-size:12px;color:var(--ink3);margin:0}
  
  .tile-zoom-actions{display:flex;gap:8px;flex-shrink:0}
  .tile-zoom-action{
    padding:6px 12px;
    border-radius:6px;
    font-size:12px;
    font-weight:600;
    border:1px solid var(--line);
    background:#fff;
    cursor:pointer;
    transition:.2s;
  }
  .tile-zoom-action:hover{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .tile-zoom-action.done{background:var(--green-soft);border-color:var(--green);color:var(--green)}
  .tile-zoom-action.dismiss{background:var(--red-soft);border-color:var(--red);color:var(--red)}
  
  .tile-zoom-chat{
    background:linear-gradient(135deg,#eef2ff 0%,#e0e7ff 100%);
    border-radius:12px;
    padding:20px;
  }
  .tile-zoom-chat h3{margin:0 0 12px;font-size:16px;font-weight:700;color:var(--ink)}
  .tile-zoom-chat-input{
    display:flex;
    gap:10px;
    background:#fff;
    border:2px solid var(--line);
    border-radius:10px;
    padding:4px;
  }
  .tile-zoom-chat-input input{
    flex:1;
    border:0;
    outline:none;
    font:inherit;
    padding:10px 12px;
    font-size:14px;
  }
  .tile-zoom-chat-input button{
    padding:10px 20px;
    border-radius:6px;
    background:var(--blue);
    color:#fff;
    border:0;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
  }
  .tile-zoom-chat-input button:hover{background:#3d5ce8}
  
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-size:12.5px;color:var(--ink);font-weight:500;font-family:inherit;cursor:pointer;transition:.2s}
  .btn:hover{border-color:#cfd3db}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.primary:hover{background:#3d5ce8}

  ul.work{list-style:none;margin:0;padding:0}
  ul.work li{display:grid;grid-template-columns:22px 1fr;gap:11px;padding:12px 0;border-top:1px solid var(--line)}
  ul.work li:first-child{border-top:0;padding-top:2px}
  .idx{font:600 11.5px/22px ui-monospace,Menlo,monospace;width:22px;height:22px;text-align:center;border-radius:50%;background:var(--blue-soft);color:var(--blue)}
  ul.work h4{margin:0 0 2px;font-size:14.5px}
  .why{font-size:12.5px;color:var(--ink2);margin:0 0 5px;line-height:1.6}

  .adv{display:inline-block;background:var(--blue-soft);border:1px solid var(--blue-line);color:#2b4ecf;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:500}

  ul.work li.closed{opacity:.55}
  ul.work li.closed h4{text-decoration:line-through}
  ul.work li.closed .idx{background:var(--green-soft);color:var(--green)}

  .dockPanel{position:fixed;right:16px;bottom:16px;width:380px;max-height:500px;background:#fff;border:1px solid var(--line);border-radius:14px;
    box-shadow:0 26px 60px -22px rgba(21,23,28,.5);display:flex;flex-direction:column;overflow:hidden;
    transform-origin:100% 100%;opacity:0;transform:translateY(10px) scale(.96);pointer-events:none;
    transition:.34s var(--ease);z-index:1000}
  .dockPanel.open{opacity:1;transform:none;pointer-events:auto}
  .dockHead{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfaf8}
  .dockHead b{font-size:13px;display:block;line-height:1.4}
  .dockHead small{font-size:10.5px;color:var(--ink3)}
  .dockHead .x{margin-left:auto;border:0;background:none;color:var(--ink3);font-size:15px;cursor:pointer;line-height:1;padding:3px 5px}
  .cites{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
  .cites-h{font-size:11px;color:var(--ink3);margin-right:2px}
  .cites a{display:inline-flex;align-items:center;gap:4px;max-width:100%;font-size:11.5px;line-height:1.3;padding:3px 8px;border-radius:999px;background:rgba(80,110,240,.08);color:#3d55c9;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cites a i{font-style:normal;font-weight:650;font-size:10px;width:15px;height:15px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .dockBody{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#fdfcfb}
  .bubble{max-width:86%;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:13px;line-height:1.65}
  .bubble.me{margin-left:auto;background:#e9eeff;border-color:var(--blue-line)}
  .bubble small{display:block;font-size:10.5px;color:var(--ink3);margin-top:4px}
  .typing{display:inline-block;animation:typing 1.5s infinite}
  @keyframes typing{0%,100%{opacity:.3}50%{opacity:1}}

  .chat-card{background:var(--gray-soft);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;max-width:92%}
  .card-title{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--ink)}
  .card-actions,.card-choices{display:flex;gap:6px;flex-wrap:wrap}
  .card-btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;font-size:12px;color:var(--ink);cursor:pointer;transition:.2s;font-family:inherit}
  .card-btn:hover{border-color:var(--blue);color:var(--blue)}
  .card-btn.choice{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue)}
  
  .dockFoot{border-top:1px solid var(--line);padding:7px 10px;display:flex;gap:8px;align-items:center;background:#fff}
  .dockFoot input{flex:1;border:0;outline:none;font:inherit;font-size:12.5px;padding:5px 2px;color:var(--ink);background:none;min-width:0}
  .dockFoot .send{width:27px;height:27px;border-radius:8px;background:var(--blue);color:#fff;border:0;font-size:13px;cursor:pointer}
  
  .dockBtn{display:none!important;position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;border:2px solid var(--blue);background:var(--blue);
    cursor:pointer;box-shadow:0 4px 12px rgba(74,108,247,.4);display:grid;place-items:center;z-index:999;transition:.25s var(--ease)}
  .dockBtn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(74,108,247,.5)}
  .dockBtn svg{fill:white}
  .dockBtn.has .badge{opacity:1;transform:scale(1)}
  .badge{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:#e5484d;border:2px solid #fff;opacity:0;transform:scale(.5);transition:.25s var(--ease)}

  .chat-open-hint{position:fixed;right:90px;bottom:30px;background:var(--ink);color:#fff;font-size:13px;padding:8px 16px;border-radius:8px;
    box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:998;opacity:0;animation:hintPulse 3s ease-in-out;pointer-events:none}
  @keyframes hintPulse{0%,100%{opacity:0}10%,90%{opacity:1}}

  .loading{text-align:center;padding:40px;color:var(--ink3)}
  .error{background:var(--red-soft);border:1px solid var(--red);border-radius:8px;padding:12px;margin:12px 0;color:var(--red)}

  .apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .app-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;transition:.2s var(--ease);cursor:pointer}
  .app-card:hover{border-color:var(--blue);box-shadow:0 4px 12px rgba(74,108,247,.1)}
  .app-card.connected{border-color:var(--green);background:var(--green-soft)}
  .app-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .app-logo{font-size:32px;width:48px;height:48px;display:grid;place-items:center;border-radius:10px;background:var(--gray-soft)}
  .app-info{flex:1}
  .app-info h4{margin:0;font-size:14px;font-weight:600}
  .app-info p{margin:2px 0 0;font-size:11.5px;color:var(--ink3)}
  .app-status{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:600}
  .app-status.connected{background:var(--green);color:#fff}
  .app-status.disconnected{background:var(--gray-soft);color:var(--ink3)}
  .app-actions{display:flex;gap:6px;margin-top:8px}
  .app-actions .btn{font-size:11.5px;padding:5px 12px}

  .source-toggle{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;
    background:#fff;font-size:12px;cursor:pointer;transition:.2s}
  .source-toggle:hover{border-color:var(--blue)}
  .source-toggle.active{background:var(--blue);border-color:var(--blue);color:#fff}
  .source-toggle input[type=checkbox]{display:none}

  @media (max-width:620px){
    .apps-grid{grid-template-columns:1fr}
  }

  @media (max-width:620px){
    .dockPanel{width:calc(100vw - 32px);right:16px;left:16px;bottom:10px;max-height:60%}
  }


  .tt-now{overflow:visible}

  .load-rows{overflow:hidden;min-width:0;width:100%}
  .load-bar{min-width:0}
  .load-val{min-width:0;overflow:hidden}
  .w-links{overflow:hidden;min-width:0}
  .lk{overflow:hidden}
  .lk-t{min-width:0}

  .focus-b span,.w-desc,.w-next-v{overflow:hidden}

  .load-row{grid-template-columns:minmax(0,110px) minmax(0,1fr) 56px}
  .load-name,.w-repo,.lk-t,.focus-b span,.w-next-v,.w-desc,.w-head,.tt-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .av-row{display:flex;gap:4px;margin:0 0 10px}
  .av.sm{width:22px;height:22px;border-radius:7px}

  .mini-bars .mb{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:36px}

  .mini-bars .mb span{font-size:10.5px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;line-height:1.2}

  .size-normal .metrics .m b{font-size:22px}
  .w-links .lk:nth-child(n+4){display:none}

  /* ===== v2 visual system (Muse / Today inspired) ===== */
  :root{
    --ink:#1c1d21; --ink2:#5a5e68; --ink3:#9296a0; --line:rgba(28,29,33,.07);
    --teal:#22a898; --teal-soft:#e3f6f3; --violet:#8a74d0; --violet-soft:#efebfa;
    --sky:#4f9de8; --sky-soft:#e7f1fc; --rose:#e2667a; --rose-soft:#fdecef; --peach:#f0a35e; --peach-soft:#fdf0e3;
    --r-lg:22px; --r-md:14px;
    --shadow:0 1px 2px rgba(30,40,80,.04),0 6px 24px -6px rgba(30,40,80,.08);
    --shadow-hi:0 2px 4px rgba(30,40,80,.05),0 18px 40px -10px rgba(30,40,80,.18);
  }
  body{background:radial-gradient(1200px 600px at 85% -10%,#e4ecfb 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#f6ecdf 0%,transparent 55%),#f3f4f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .app{grid-template-columns:208px 1fr}
  .side{background:rgba(255,255,255,.45);backdrop-filter:blur(20px);border-right:1px solid rgba(255,255,255,.7);padding:20px 14px}
  .side .who{padding:4px 10px 22px}
  .side .who b{font-size:15px;letter-spacing:.02em}
  .nav{padding:9px 12px;border-radius:12px;font-size:13.5px}
  .nav.on{background:#fff;box-shadow:0 1px 2px rgba(30,40,80,.06),0 4px 12px -4px rgba(30,40,80,.08)}
  .views{background:transparent}
  #v-today{padding:36px 44px 0}
  .c-teal{color:var(--teal)} .c-violet{color:var(--violet)} .c-blue{color:var(--sky)} .c-rose{color:var(--rose)}

  .day-head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;margin-bottom:22px}
  .day-date{font-size:12.5px;color:var(--ink3);letter-spacing:.02em;margin-bottom:6px}
  .day-title{font-size:34px;line-height:1.15;font-weight:650;letter-spacing:-.025em;margin:0}
  .day-sum{margin:8px 0 0;font-size:14px;color:var(--ink2)}
  .day-side{display:flex;align-items:center;gap:22px;flex-shrink:0}
  .kpis{display:flex;gap:6px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:8px 6px;box-shadow:var(--shadow)}
  .kpi{min-width:74px;padding:2px 14px;text-align:center;border-right:1px solid var(--line)}
  .kpi:last-child{border-right:0}
  .kpi b{display:block;font-size:24px;font-weight:650;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
  .kpi span{font-size:11.5px;color:var(--ink3)}
  .day-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .digest-status{font-size:11.5px;color:var(--teal);min-height:16px}
  .btn-glow{border:0;cursor:pointer;font:600 13.5px/1 inherit;color:#fff;padding:12px 20px;border-radius:999px;background:linear-gradient(135deg,#6f8df5,#8a74d0);box-shadow:0 6px 18px -6px rgba(110,110,230,.6);transition:.2s var(--ease)}
  .btn-glow:hover{transform:translateY(-1px);box-shadow:0 10px 24px -8px rgba(110,110,230,.7)}
  .btn-glow:disabled{opacity:.6;cursor:default;transform:none}

  .eyebrow{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}

  /* My Day */
  .myday{background:rgba(255,255,255,.72);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.9);border-radius:var(--r-lg);padding:18px 22px 14px;box-shadow:var(--shadow);margin-bottom:18px;cursor:pointer;transition:.25s var(--ease)}
  .myday:hover{box-shadow:var(--shadow-hi)}
  .myday-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:14px}
  .myday-note{font-size:15px;font-weight:550;margin-top:4px}
  .myday-meta{display:flex;gap:16px;font-size:12px;color:var(--ink3);white-space:nowrap}
  .myday-meta b{color:var(--ink);font-weight:650}
  .tt{position:relative;padding:0 4px}
  .tt-track{position:relative;height:46px;border-radius:12px;background:repeating-linear-gradient(90deg,rgba(30,40,80,.035) 0 1px,transparent 1px calc(100%/14)),#f6f7fa;overflow:hidden}
  .tt-bar{position:absolute;box-sizing:border-box;border-radius:9px;padding:4px 8px;overflow:hidden;white-space:nowrap;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .tt-bar b{overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:650;line-height:1.2}
  .tt-bar span{font-size:11px;opacity:.8;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
  .tt-bar.c-meal{background:var(--peach-soft);color:#b8692a;box-shadow:inset 3px 0 0 var(--peach)}
  .tt-bar.c-focus{background:var(--teal-soft);color:#16786d;box-shadow:inset 3px 0 0 var(--teal)}
  .tt-bar.c-meeting{background:var(--sky-soft);color:#2d6cb0;box-shadow:inset 3px 0 0 var(--sky)}
  .tt-bar.c-work,.tt-bar.c-review,.tt-bar.c-learning{background:var(--sky-soft);color:#2d6cb0;box-shadow:inset 3px 0 0 var(--sky)}
  .tt-bar.c-admin,.tt-bar.c-winddown{background:#f1f2f6;color:#5b6275;box-shadow:inset 3px 0 0 #b9bfcc}
  .myday-edited{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;color:var(--teal);background:var(--teal-soft);border-radius:999px;padding:1px 8px;vertical-align:2px}
  .myday.flash{animation:mydayFlash 1.4s var(--ease)}
  @keyframes mydayFlash{0%{box-shadow:0 0 0 0 rgba(34,168,152,.45)}100%{box-shadow:0 0 0 14px rgba(34,168,152,0)}}
  .tt-bar.c-break,.tt-bar.c-exercise,.tt-bar.c-personal{background:var(--violet-soft);color:#6450a8;box-shadow:inset 3px 0 0 var(--violet)}
  .tt-bar.past{opacity:.45;filter:saturate(.6)}
  .tt-bar.live{box-shadow:inset 3px 0 0 currentColor,0 0 0 2px rgba(34,168,152,.25)}
  .tt-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink3)}
  .tt-now{position:absolute;top:0;bottom:0;width:2px;z-index:3;pointer-events:none;background:var(--rose);border-radius:2px;transform:translateX(-1px)}
  .tt-now::before{content:"";position:absolute;top:-1px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--rose)}
  .tt-now em{position:absolute;z-index:4;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.12);bottom:3px;right:6px;font:600 10.5px/1 inherit;font-style:normal;color:var(--rose);background:rgba(255,255,255,.9);padding:3px 5px;border-radius:6px}
  .tt-axis{position:relative;height:18px;margin-top:4px}
  .tt-tick{position:absolute;top:0;transform:translateX(-50%)}
  .tt-tick:first-child{transform:none}
  .tt-tick:last-child{transform:translateX(-100%)}
  .tt-tick i{font-style:normal;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}

  /* Grid */
  .grid2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-flow:row dense;gap:16px;padding-bottom:120px}
  .grid2 .tile{background:rgba(255,255,255,.82);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.95);border-radius:var(--r-lg);padding:20px 20px 16px;box-shadow:var(--shadow);color:var(--ink);transform:none;display:flex;flex-direction:column;min-width:0;overflow:hidden;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
  .grid2 .tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi)}
  .size-hero{grid-column:span 2;grid-row:span 2}
  .size-load{grid-column:span 2;grid-row:span 2}
  .size-wide{grid-column:span 2}
  .size-normal{grid-column:span 1}
  @media (max-width:1180px){.grid2{grid-template-columns:repeat(3,minmax(0,1fr))}.size-hero,.size-load{grid-column:span 3;grid-row:auto}}
  @media (max-width:860px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.size-hero,.size-load,.size-wide{grid-column:span 2}}

  /* Hero */
  .grid2 .hero2{background:linear-gradient(160deg,rgba(255,255,255,.95) 0%,rgba(241,237,252,.92) 55%,rgba(228,240,252,.92) 100%);cursor:default}
  .grid2 .hero2:hover{transform:none}
  .hero-lead{font-size:19px;line-height:1.5;font-weight:600;letter-spacing:-.01em;margin:10px 0 16px}
  .focus{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .focus li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.95);cursor:pointer;transition:.2s var(--ease)}
  .focus li:hover{background:#fff;box-shadow:0 4px 14px -6px rgba(30,40,80,.18)}
  .focus-n{width:24px;height:24px;flex-shrink:0;border-radius:8px;background:var(--violet-soft);color:var(--violet);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .focus-b{flex:1;min-width:0;display:flex;flex-direction:column}
  .focus-b b{font-size:13.5px;font-weight:650}
  .focus-b span{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .focus-go{color:var(--ink3);font-size:14px}
  .hero-foot{margin-top:auto;padding-top:16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .hero-kpi b{display:block;font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
  .hero-kpi span,.hero-ring span{font-size:11.5px;color:var(--ink3)}
  .hero-kpi:first-child b{color:var(--teal)} .hero-kpi:nth-child(2) b{color:var(--violet)}
  .hero-ring{display:flex;align-items:center;gap:8px}
  .hero-ring b{display:block;font-size:15px;font-weight:650;line-height:1.1}
  .hero-ring small{font-size:11px;color:var(--ink3);font-weight:500}
  .hero-ring span{display:block;white-space:nowrap}

  /* Load */
  .grid2 .load{cursor:default}
  .grid2 .load:hover{transform:none}
  .load-desc{font-size:12.5px;color:var(--ink2);margin:6px 0 14px;line-height:1.55}
  .load-rows{display:flex;flex-direction:column;gap:9px}
  .load-row{display:grid;grid-template-columns:120px 1fr 64px;align-items:center;gap:12px;padding:3px 6px;margin:0 -6px;border-radius:8px;cursor:pointer}
  .load-row:hover{background:rgba(30,40,80,.04)}
  .load-name{font-size:12.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .load-bar{display:flex;height:10px;border-radius:6px;background:#f0f1f5;overflow:hidden}
  .load-bar i{display:block;height:100%}
  .b-pr{background:linear-gradient(90deg,#5ccfc0,var(--teal))}
  .b-iss{background:linear-gradient(90deg,#b3a3e6,var(--violet))}
  .load-val{display:flex;gap:6px;justify-content:flex-end;font-size:12px;font-variant-numeric:tabular-nums}
  .load-val em{font-style:normal;font-weight:650}
  .v-pr{color:var(--teal)} .v-iss{color:var(--violet)}
  .legend{margin-top:auto;padding-top:12px;display:flex;gap:14px;font-size:11.5px;color:var(--ink3)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  /* Work tile */
  .w-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .av{width:30px;height:30px;border-radius:9px;flex-shrink:0;object-fit:cover;background:#eef0f4;box-shadow:0 0 0 1px rgba(30,40,80,.06)}
  .av-f{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink2)}
  .w-src{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
  .w-label{font-size:10.5px;font-weight:650;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase}
  .w-repo{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{font-size:11px;font-weight:650;padding:3px 9px;border-radius:999px;flex-shrink:0}
  .pill-hot{background:var(--rose-soft);color:var(--rose)}
  .w-head{font-size:17px;line-height:1.35;font-weight:650;letter-spacing:-.01em;margin:0 0 6px}
  .size-normal .w-head{font-size:16px}
  .w-desc{font-size:13px;line-height:1.6;color:var(--ink2);margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .size-normal .w-desc{-webkit-line-clamp:3}
  .metrics{display:flex;align-items:center;gap:20px;margin:2px 0 14px}
  .metrics .m b{display:block;font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
  .metrics .m span{font-size:11.5px;color:var(--ink3)}
  .m-bar{flex:1;display:flex;height:8px;border-radius:5px;overflow:hidden;gap:2px;background:#f0f1f5;min-width:60px}
  .m-bar i{display:block;height:100%;min-width:0}
  .spark{width:100%;height:28px;color:var(--teal);margin-bottom:10px}
  .w-next{margin-top:auto;display:flex;gap:8px;align-items:baseline;padding:9px 11px;border-radius:12px;background:rgba(34,168,152,.07);margin-bottom:10px}
  .w-next-k{font-size:11px;font-weight:700;color:var(--teal);flex-shrink:0;letter-spacing:.04em}
  .w-next-v{font-size:12.5px;line-height:1.5;color:var(--ink);min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .w-links{display:flex;flex-direction:column;gap:2px}
  .lk{display:flex;align-items:center;gap:8px;padding:5px 6px;margin:0 -6px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:12.5px;min-width:0;transition:.15s}
  .lk:hover{background:rgba(30,40,80,.05);color:var(--ink)}
  .lk-ic{display:inline-flex;width:20px;height:20px;border-radius:6px;align-items:center;justify-content:center;flex-shrink:0}
  .lk-pr .lk-ic,.lk-ic.lk-pr{background:var(--teal-soft);color:var(--teal)}
  .lk-issue .lk-ic,.lk-ic.lk-issue{background:var(--violet-soft);color:var(--violet)}
  .lk-mail .lk-ic,.lk-ic.lk-mail{background:var(--peach-soft);color:var(--peach)}
  .lk-repo .lk-ic,.lk-link .lk-ic,.lk-ic.lk-link{background:#eef0f4;color:var(--ink2)}
  .lk-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lk-arrow{color:var(--ink3);font-size:11px;opacity:0;transition:.15s}
  .lk:hover .lk-arrow{opacity:1}

  /* Bottom ask bar */
    /* Inline Bot chat sheet on the today page (not the right-side dock). */
  .today-chat{position:sticky;bottom:0;margin:0 -44px;padding:0 44px 18px;z-index:6;pointer-events:none}
  .today-chat > *{pointer-events:auto}
  .today-chat-sheet{max-height:0;overflow:hidden;opacity:0;transform:translateY(12px);transition:.32s var(--ease);background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.95);border-radius:22px 22px 18px 18px;box-shadow:var(--shadow-hi);margin:0 auto 10px;max-width:720px;display:flex;flex-direction:column}
  .today-chat.open .today-chat-sheet{max-height:min(420px,52vh);opacity:1;transform:none}
  .today-chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;border-bottom:1px solid rgba(30,40,80,.06)}
  .today-chat-head b{font-size:13px}
  .today-chat-head small{font-size:11px;color:var(--ink3);margin-left:4px}
  .today-chat-head .x{margin-left:auto;border:0;background:rgba(30,40,80,.05);width:28px;height:28px;border-radius:50%;cursor:pointer;color:var(--ink3);font-size:14px}
  .today-chat-msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px;min-height:120px}
  .today-chat-msgs .bubble{max-width:88%}
  .today-chat .today-chat-input{position:static;margin:0;padding:0 0 4px;background:none;box-shadow:none}
  .today-chat .today-chat-input .input-wrap{max-width:720px;margin:0 auto}
  #v-today .today-chat .today-chat-input{position:static;margin:0;padding:0;background:none}

  #v-today .today-chat-input .input-wrap{max-width:640px;margin:0 auto;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.95);border-radius:999px;box-shadow:var(--shadow-hi);padding:6px 6px 6px 20px}
  #v-today .today-chat-input .send-btn{border-radius:50%;background:linear-gradient(135deg,#6f8df5,#8a74d0)}
  .grid2{padding-bottom:12px}
  /* Bot replies: rendered Markdown */
  .md{font-size:13.5px;line-height:1.72;color:var(--ink);overflow-wrap:anywhere}
  .md p{margin:0 0 8px}.md>:last-child{margin-bottom:0}
  .md strong{font-weight:680}
  .md-h{font-weight:700;font-size:13.5px;margin:12px 0 4px}.md>.md-h:first-child{margin-top:0}
  .md-label{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;margin:12px 0 4px;padding:2px 10px;border-radius:999px;background:rgba(111,141,245,.11);color:#4a5fb8}
  .md>.md-label:first-child{margin-top:2px}
  .md-label-hot{background:rgba(236,108,92,.12);color:#c2493a}
  .md-label-mute{background:rgba(30,40,80,.06);color:var(--ink3)}
  .md-list{margin:2px 0 8px;padding-left:20px}
  .md-list li{margin:3px 0;padding-left:2px}
  .md-list li::marker{color:#8a74d0;font-weight:600}
  .md code{font:500 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(30,40,80,.06);padding:1px 5px;border-radius:5px}
  .md a{color:#4f6fe0;text-decoration:none;border-bottom:1px solid rgba(79,111,224,.28);transition:.15s}
  .md a:hover{color:#3550c4;border-bottom-color:currentColor}
  .today-chat-msgs .bubble.bot{max-width:92%;padding:11px 14px}
  .z-msg.bot .md{font-size:14px}
  /* Card zoom: handled items */
  .z-sub{font-weight:500;color:var(--ink3);letter-spacing:0}
  .z-item.is-done,.z-item.is-dismissed{opacity:1;background:#f9fafb}
  .z-item.is-done .z-item-b b{text-decoration:line-through;text-decoration-color:rgba(30,40,80,.35);color:var(--ink3)}
  .z-item.is-dismissed .z-item-b b{color:var(--ink3)}
  .z-item.is-dismissed .lk-ic{opacity:.45}
  .z-check{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#41c7a0,#2fa883);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
  .z-act.undo{color:#4f6fe0}
  .z-empty{font-size:13px;color:var(--ink3);padding:10px 12px}
  .z-done{margin-top:10px}
  .z-done summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--ink3);padding:4px 2px;list-style:none;user-select:none}
  .z-done summary::-webkit-details-marker{display:none}
  .z-done summary::before{content:'▸';display:inline-block;margin-right:6px;transition:.2s}
  .z-done[open] summary::before{transform:rotate(90deg)}
  .z-done .z-items{margin-top:6px}
  /* Bottom dock: one continuous soft fade across the column, no hard-edged blur boxes.
     The base .today-chat-input carries a full-bleed backdrop-filter; kill it here so only
     the pill is glass, and let a masked ::before do a gentle blur + tint that fades in. */
  #v-today .today-chat .today-chat-input{backdrop-filter:none;-webkit-backdrop-filter:none;border-top:0}
  #v-today .today-chat{padding-top:44px}
  #v-today .today-chat::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:linear-gradient(to bottom,rgba(243,244,247,0) 0%,rgba(243,244,247,.55) 55%,rgba(243,244,247,.82) 100%);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 60%);mask-image:linear-gradient(to bottom,transparent 0%,#000 60%)}
  #v-today .today-chat.open::before{background:linear-gradient(to bottom,rgba(243,244,247,0) 0%,rgba(243,244,247,.7) 35%,rgba(243,244,247,.88) 100%)}
  /* Room so the last row of tiles can scroll fully clear of the dock. */
  #v-today .grid2{padding-bottom:40px}
  .dockBtn{background:linear-gradient(135deg,#6f8df5,#8a74d0)!important;box-shadow:0 10px 24px -8px rgba(110,110,230,.7)!important}

  /* Zoom modal */
  .tile-zoom-overlay{background:rgba(28,30,40,.28)!important;backdrop-filter:blur(10px)}
  .tile-zoom-modal{border-radius:26px!important;max-width:760px!important;width:min(760px,92vw)!important;padding:30px 32px 24px!important;background:rgba(255,255,255,.96)!important;box-shadow:0 30px 80px -20px rgba(30,40,80,.35)!important}
  .tile-zoom-title{font-size:24px!important;font-weight:650!important;letter-spacing:-.02em;margin:0 40px 6px 0!important;color:var(--ink)!important}
  .tile-zoom-subtitle{font-size:13px!important;color:var(--ink3)!important;margin:0 0 16px!important;-webkit-line-clamp:unset!important;display:block!important}
  .tile-zoom-subtitle a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line)}
  .z-src{font-weight:650;letter-spacing:.04em}
  .z-body{font-size:14.5px;line-height:1.75;color:var(--ink);margin:0 0 8px}
  .z-orig{font-size:12px;color:var(--ink3);margin:0 0 14px}
  .z-kpis{display:flex;gap:28px;margin:4px 0 16px}
  .z-kpis b{display:block;font-size:30px;font-weight:650;line-height:1.1}
  .z-kpis span{font-size:12px;color:var(--ink3)}
  .z-next{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(34,168,152,.09),rgba(79,157,232,.08));margin-bottom:18px}
  .z-next b{display:block;font-size:14.5px;margin-top:2px}
  .z-btn{flex-shrink:0;text-decoration:none;color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;background:var(--teal)}
  .z-sec h4,.z-chat h4{font-size:11.5px;font-weight:650;letter-spacing:.06em;color:var(--ink3);margin:0 0 8px}
  .z-items{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
  .z-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#f6f7fa;transition:.2s}
  .z-item.is-done{opacity:.5}.z-item.is-dismissed{opacity:.3}
  .z-time{font-size:12.5px;font-weight:650;color:var(--teal);font-variant-numeric:tabular-nums;min-width:88px}
  .z-item-b{flex:1;min-width:0;display:flex;flex-direction:column}
  .z-item-b b{font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .z-item-b span{font-size:11.5px;color:var(--ink3)}
  .z-acts{display:flex;gap:4px;flex-shrink:0}
  .z-act{border:0;background:#fff;color:var(--ink2);font:500 12px/1 inherit;padding:7px 10px;border-radius:8px;cursor:pointer;text-decoration:none;box-shadow:0 0 0 1px var(--line)}
  .z-act:hover{color:var(--ink);box-shadow:0 0 0 1px rgba(30,40,80,.15)}
  .z-act.done:hover{color:var(--teal)}
  .z-item-b .z-meta{display:block;font-size:12px;color:var(--ink3)}
  .z-item:has(.z-text){align-items:flex-start}
  .z-item.is-done .z-text,.z-item.is-dismissed .z-text{color:var(--ink3)}
  .z-need{font-style:normal;color:var(--rose);font-weight:600}
  .z-text{font-size:13.5px;line-height:1.6;color:var(--ink);margin-top:4px;word-break:break-word}
  .z-text.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .z-text p{margin:0 0 4px}
  .z-more{border:0;background:none;padding:2px 0;color:var(--sky,#4a73d9);font:600 12px inherit;cursor:pointer}
  .lk-slack{color:#7b5ad9}
  .src-note{margin:4px 0 14px;font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .src-note.src-bad{color:var(--rose)}
  .src-recheck{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font:500 12px inherit;color:var(--ink2);cursor:pointer}
  .src-spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink3);animation:srcspin .8s linear infinite;display:inline-block}
  @keyframes srcspin{to{transform:rotate(360deg)}}
  .act-card{align-self:stretch;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line) inset;padding:12px 14px;font-size:13px;line-height:1.55}
  .act-card.act-pending{box-shadow:0 0 0 1.5px rgba(232,120,60,.55) inset;background:linear-gradient(180deg,#fffaf5,#fff)}
  .act-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .act-h b{font-weight:600;color:var(--ink)}
  .act-st{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:#eef0f4;color:var(--ink3)}
  .act-pending .act-st{background:#fde9dc;color:#c2551b}
  .act-executed .act-st{background:var(--green-soft,#e3f6ec);color:var(--green,#1f9d63)}
  .act-failed .act-st{background:var(--rose-soft);color:var(--rose)}
  .act-prev{margin-top:8px;display:grid;gap:4px;color:var(--ink2)}
  .act-prev span{display:inline-block;min-width:34px;color:var(--ink3);font-size:12px;margin-right:6px}
  .act-body{white-space:pre-wrap;background:#f6f7fa;border-radius:10px;padding:8px 10px;max-height:180px;overflow:auto;color:var(--ink)}
  .act-err{margin-top:6px;color:var(--rose);font-size:12.5px}
  .act-note{margin-top:4px;color:var(--ink3);font-size:12px}
  .act-btns{display:flex;gap:8px;margin-top:10px}

  .chat-fail{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--rose);font-size:13px;white-space:normal}
  .chat-retry{border:1px solid currentColor;background:#fff;color:var(--rose);border-radius:999px;padding:3px 12px;font:600 12px inherit;cursor:pointer}

  .typing-note{font-size:12.5px;color:var(--ink3)}
  /* Zoom: two columns — details left (own scroll), full-height chat right */
  .tile-zoom-modal{width:min(1200px,94vw)!important;max-width:none!important;height:88vh!important;max-height:none!important;padding:0!important;overflow:hidden!important;display:flex!important;flex-direction:column}
  .tile-zoom-content{flex:1;min-height:0;padding:0!important;overflow:hidden!important;margin:0!important;display:block!important}

  .z-chat-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:22px 64px 14px 22px;border-bottom:1px solid rgba(0,0,0,.05)}
  .z-chat-head b{display:block;font-size:15px;font-weight:650;color:var(--ink);letter-spacing:-.01em}
  .z-chat-head span{display:block;font-size:12px;color:var(--ink3);margin-top:3px}

  .z-compose .z-sugg{margin-bottom:10px}
  .z-compose .z-chip{text-align:left;line-height:1.35}
  .z-compose .z-input{background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.03),0 0 0 1px var(--line) inset}
  .z-chat .z-msg{max-width:92%}
  .z-chat .z-msg.bot{background:#fff;box-shadow:0 1px 2px rgba(20,30,60,.05),0 0 0 1px rgba(0,0,0,.035)}
  .z-chat .z-msg.me{max-width:80%}
  @media (max-width:900px){
    .tile-zoom-modal{height:92vh!important;width:96vw!important}
    .tile-zoom-content{overflow-y:auto!important}
    .z-split{display:block;height:auto}
    .z-left{overflow:visible;padding:24px 20px 18px}
    .z-chat{border-left:0;border-top:1px solid var(--line);min-height:520px;height:70vh}
    .z-chat-head{padding:18px 20px 12px}
  }
  .z-msg{max-width:85%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
  .z-msg.me{align-self:flex-end;background:linear-gradient(135deg,#6f8df5,#8a74d0);color:#fff;border-bottom-right-radius:4px}
  .z-msg.bot{align-self:flex-start;background:#f3f4f8;border-bottom-left-radius:4px}
  .z-msg.typing{color:var(--ink3)}
  .z-sugg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .z-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:12.5px/1.2 inherit;color:var(--ink2);cursor:pointer}
  .z-chip:hover{border-color:rgba(138,116,208,.4);color:var(--violet)}
  .z-input{display:flex;gap:8px;background:#f6f7fa;border-radius:999px;padding:5px 5px 5px 16px}
  .z-input input{flex:1;border:0;background:transparent;font:14px inherit;outline:none;min-width:0}
  .z-input button{border:0;border-radius:999px;padding:8px 16px;font:600 13px inherit;color:#fff;background:linear-gradient(135deg,#6f8df5,#8a74d0);cursor:pointer}

  /* zoom overflow fix */
  .tile-zoom-modal{box-sizing:border-box!important;max-height:88vh!important;overflow-x:hidden!important;overflow-y:auto!important}
  .tile-zoom-content,.tile-zoom-content *{box-sizing:border-box;max-width:100%}
  .tile-zoom-content{overflow-x:hidden;min-width:0}
  .z-next>*{min-width:0}.z-next{flex-wrap:wrap}
  .z-item{min-width:0;flex-wrap:nowrap}
  .z-item-b>*{white-space:normal!important;overflow-wrap:anywhere;word-break:break-word}
  .tile-zoom-title,.tile-zoom-content p,.tile-zoom-content div{overflow-wrap:anywhere}

  /* sources grid */
  #v-sources,#v-settings{padding:36px 44px 60px}
  .src-summary{display:flex;align-items:center;gap:28px;margin:4px 0 22px}
  .src-summary b{display:block;font-size:28px;font-weight:650;line-height:1.1}
  .src-summary span{font-size:12px;color:var(--ink3)}
  .src-warn{margin:0;font-size:13px;color:var(--rose)}
  .src-group{margin-bottom:26px}
  .src-group-h{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
  .src-group-h b{font-size:15px;font-weight:650}
  .src-group-h span{font-size:12px;color:var(--ink3)}
  .src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .src-tile{background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.95);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;transition:.2s var(--ease)}
  .src-tile:hover{box-shadow:var(--shadow-hi);transform:translateY(-1px)}
  .src-tile.is-on{background:linear-gradient(160deg,#fff,rgba(227,246,243,.9))}
  .src-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .src-top img,.src-fb{width:36px;height:36px;border-radius:10px;object-fit:contain;background:#fff;box-shadow:0 0 0 1px var(--line)}
  .src-fb{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink2)}
  .src-pill{font-size:11px;font-weight:650;padding:3px 9px;border-radius:999px}
  .src-pill.on{background:var(--teal-soft);color:var(--teal)}
  .src-pill.wait{background:var(--peach-soft);color:var(--peach)}
  .src-pill.off{background:#eef0f4;color:var(--ink3)}
  .src-tile h4{margin:0 0 4px;font-size:14.5px;font-weight:650}
  .src-tile p{margin:0 0 14px;font-size:12.5px;line-height:1.55;color:var(--ink2);flex:1}
  .src-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .src-auth{font-size:11px;color:var(--ink3)}
  .src-btn{border:0;cursor:pointer;font:600 12.5px/1 inherit;color:#fff;padding:8px 14px;border-radius:999px;background:linear-gradient(135deg,#6f8df5,#8a74d0)}
  .src-btn.ghost{background:#fff;color:var(--ink2);box-shadow:0 0 0 1px var(--line)}

  .dockPanel{width:420px;max-height:min(680px,calc(100vh - 32px))}
  /* flex column children default to flex-shrink:1; with overflow:hidden their min-height becomes 0,
     so a tall reply squashes every card. Never shrink dock messages; the body scrolls instead. */
  .dockBody{min-height:0;overscroll-behavior:contain}
  .dockBody > *{flex-shrink:0}
  .gcard{flex-shrink:0;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;box-shadow:0 1px 2px rgba(30,40,80,.04);position:relative;overflow:hidden}
  .gcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#d7dbe3}
  .gcard.g-you::before{background:var(--rose)} .gcard.g-others::before{background:var(--sky)}
  .gc-top{display:flex;align-items:center;gap:10px}
  .gc-count{flex-shrink:0;min-width:34px;height:34px;padding:0 8px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;background:#f1f2f6;color:var(--ink)}
  .g-you .gc-count{background:var(--rose-soft);color:var(--rose)} .g-others .gc-count{background:var(--sky-soft);color:var(--sky)}
  .gc-h{display:flex;flex-direction:column;min-width:0}
  .gc-h b{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gc-w{font-size:11px;color:var(--ink3)} .gc-w.you{color:var(--rose)} .gc-w.others{color:var(--sky)}
  .gc-why{margin:8px 0 0;font-size:12.5px;line-height:1.55;color:var(--ink2)}
  .gc-bd{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .gc-bd span{font-size:11.5px;background:#f4f5f8;border-radius:999px;padding:3px 9px;color:var(--ink2)}
  .gc-next{margin-top:8px;font-size:12.5px;line-height:1.5;background:rgba(34,168,152,.08);border-radius:10px;padding:7px 10px}
  .gc-next span{font-size:11px;font-weight:700;color:var(--teal);margin-right:6px}
  .gc-links{display:flex;flex-direction:column;gap:2px;margin-top:8px}
  .gc-links a{font-size:12px;color:var(--ink2);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:3px 0}
  .gc-links a::before{content:"↗ ";color:var(--ink3)}
  .gc-links a:hover{color:var(--ink)}
  .w-senders{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 8px}
  .w-senders span{font-size:11.5px;color:var(--ink3);background:#eef0f4;border-radius:999px;padding:2px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .metrics.mail-m{align-items:center}
  .metrics.mail-m .need-pill{margin-left:auto}
  .z-sec h4 .z-bulk{float:right;font-size:12px;font-weight:500;padding:3px 10px}

  /* ===== Intelligent UI P1: bot view ops ===== */
  .tile.work{position:relative}
  .pin-btn{position:absolute;top:10px;right:10px;border:0;background:rgba(255,255,255,.85);border-radius:8px;width:26px;height:26px;font-size:13px;cursor:pointer;opacity:0;transition:opacity .2s;z-index:2}
  .tile.work:hover .pin-btn,.pin-btn.on{opacity:1}
  .pin-badge{font-size:11.5px;font-weight:600;color:#7a5cc4;background:#f1ecfb;border-radius:999px;padding:3px 10px;align-self:flex-start;margin-bottom:8px;max-width:calc(100% - 40px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pin-badge.by-user{color:#1f7a6e;background:#e3f5f1}
  .tile.is-pinned{box-shadow:0 0 0 2px rgba(138,116,208,.35),0 6px 22px rgba(60,40,120,.08)}
  .tile.ui-hl{box-shadow:0 0 0 3px rgba(245,166,35,.65),0 8px 26px rgba(245,166,35,.18)}
  .hl-chip{font-size:11.5px;font-weight:600;color:#9a5b00;background:#fff3dc;border-radius:999px;padding:3px 10px;align-self:flex-start;margin-bottom:8px}
  .tile.ui-flash{animation:uiFlash 1.4s ease}
  @keyframes uiFlash{0%{transform:scale(1)}25%{transform:scale(1.02);box-shadow:0 0 0 4px rgba(138,116,208,.55)}100%{transform:scale(1)}}
  .z-item.ui-hl{background:#fff6e2;box-shadow:inset 3px 0 0 #f5a623}
  .z-item.sel{background:#f3f0fb}
  .ui-filterbar{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:10px 14px;border-radius:12px;background:#f1ecfb;color:#4b3a86;font-size:13px;font-weight:600}
  .ui-filterbar button{margin-left:auto;border:1px solid rgba(75,58,134,.25);background:#fff;border-radius:8px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:#4b3a86}
  .ui-toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);display:flex;align-items:center;gap:10px;max-width:min(640px,90vw);padding:10px 12px 10px 14px;border-radius:14px;background:#1f1d2b;color:#fff;font-size:13.5px;box-shadow:0 12px 36px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s ease;z-index:9999}
  .ui-toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .ui-toast-t{flex:1;line-height:1.4}
  .ui-toast-undo{border:0;background:#8a74d0;color:#fff;border-radius:8px;padding:5px 12px;font-weight:600;cursor:pointer}
  .ui-toast-x{border:0;background:transparent;color:rgba(255,255,255,.6);cursor:pointer;font-size:13px}

  /* ===== Intelligent UI P2: temporary views (vetted components) ===== */
  .sf{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:8px 0;box-shadow:0 4px 18px rgba(40,30,90,.06);font-size:13px;color:var(--ink);max-width:100%;overflow:hidden}
  .sf-panel{border-color:#d9d0f3;box-shadow:0 6px 24px rgba(90,60,180,.10)}
  .sf-card{border:0;box-shadow:none;padding:0;margin:0}
  .sf-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .sf-title{font-size:14.5px;font-weight:700}
  .sf-badge{font-size:11px;font-weight:600;color:#7a5cc4;background:#f1ecfb;border-radius:999px;padding:2px 8px}
  .sf-saved{font-size:11.5px;color:#1f7a6e}
  .sf-head-acts{margin-left:auto;display:flex;gap:6px}
  .sf-btn{border:1px solid rgba(75,58,134,.22);background:#fff;color:#4b3a86;border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
  .sf-btn:hover{background:#f6f3fd}
  .sf-btn.sm{padding:3px 9px;font-size:11.5px}
  .sf-btn.ghost{border-color:transparent;background:#f6f4fb}
  .sf-btn.primary{background:#8a74d0;border-color:#8a74d0;color:#fff}
  .sf-btn:disabled{opacity:.55;cursor:default}
  .sf-h{margin:12px 0 6px;font-size:12.5px;font-weight:700;color:#4b3a86}
  .sf-col>.sf-h:first-child,.sf-block>.sf-h:first-child{margin-top:0}
  .sf-section{padding:10px 0;border-top:1px dashed var(--line)}
  .sf-text{margin:6px 0;line-height:1.6}
  .sf-callout{border-radius:10px;padding:9px 12px;margin:6px 0;line-height:1.55}
  .sf-tone-info{background:#eef4fe;color:#244c86}.sf-tone-warn{background:#fff5e3;color:#8a5600}.sf-tone-success{background:#e6f6f2;color:#1f6e60}
  .sf-table-wrap{overflow-x:auto;margin:4px 0}
  .sf-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .sf-table th{text-align:left;font-weight:600;color:#6b6780;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .sf-table td{padding:7px 8px;border-bottom:1px solid #f1eff6;vertical-align:top;line-height:1.45}
  .sf-table tr:hover td{background:#faf9fd}
  .sf-sortable{cursor:pointer;user-select:none}
  .sf-sortable::after{content:' ↕';opacity:.35}
  .sf-sortable[data-dir=asc]::after{content:' ↑';opacity:.8}.sf-sortable[data-dir=desc]::after{content:' ↓';opacity:.8}
  .sf-compare th.sf-th-field{color:#8a8698;font-weight:600;width:90px}
  .sf-compare thead th{white-space:normal;min-width:160px;color:var(--ink)}
  .sf-link{color:#3d5bd9;text-decoration:none;font-weight:600}
  .sf-link:hover{text-decoration:underline}
  .sf-row-acts{display:inline-flex;gap:4px}
  .sf-list{list-style:none;margin:4px 0;padding:0}
  .sf-list li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;padding:7px 0;border-bottom:1px solid #f1eff6}
  .sf-meta{color:#8a8698;font-size:12px}
  .sf-kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:6px 0}
  .sf-kv dt{color:#8a8698}.sf-kv dd{margin:0;font-weight:600}.sf-kv dd.sf-num{color:#8a74d0;font-size:15px}
  .sf-timeline{list-style:none;margin:6px 0;padding:0 0 0 14px;border-left:2px solid #e6e0f6}
  .sf-timeline li{position:relative;display:flex;gap:10px;padding:5px 0}
  .sf-timeline li::before{content:'';position:absolute;left:-19px;top:11px;width:8px;height:8px;border-radius:50%;background:#8a74d0}
  .sf-timeline time{color:#8a8698;font-size:12px;min-width:84px}
  .sf-chart{margin:6px 0}
  .sf-bar-row{display:grid;grid-template-columns:minmax(70px,140px) 1fr 34px;gap:8px;align-items:center;padding:3px 0}
  .sf-bar-l{color:#6b6780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sf-bar-t{background:#f2effa;border-radius:6px;height:10px;overflow:hidden}
  .sf-bar-t i{display:block;height:100%;background:linear-gradient(90deg,#22a898,#8a74d0);border-radius:6px}
  .sf-bar-v{text-align:right}
  .sf-chart-line svg{width:100%;height:90px;color:#8a74d0}
  .sf-chart-axis{display:flex;justify-content:space-between;gap:6px;color:#8a8698;font-size:11px;flex-wrap:wrap}
  .sf-form{display:flex;flex-direction:column;gap:10px;margin:6px 0}
  .sf-field{display:flex;flex-direction:column;gap:4px}
  .sf-field.sf-check{flex-direction:row;align-items:center;gap:8px}
  .sf-field-l{font-size:12px;font-weight:600;color:#6b6780}
  .sf-field input[type=text],.sf-field select,.sf-field textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;background:#fff}
  .sf-field textarea{resize:vertical;line-height:1.55}
  .sf-form-foot{display:flex;align-items:center;gap:10px}
  .sf-form-note{color:#8a8698;font-size:11.5px;flex:1}
  .sf-form-status{color:#1f7a6e;font-size:12px}
  .sf-buttons{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .sf-refs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid #f1eff6;color:#8a8698;font-size:11.5px}
  .sf-ref{border:0;background:#f6f4fb;border-radius:999px;padding:2px 9px;font-size:11.5px;color:#4b3a86;cursor:pointer}
  .sf-empty{color:#8a8698;font-size:12px;padding:6px 0}
  .ui-panels{display:flex;flex-direction:column;gap:12px;margin:0 0 16px}
  .tile.view-tile{padding:16px 18px}
  .today-chat-msgs .sf,.z-msgs .sf{align-self:stretch}
  .ui-suggest{position:fixed;top:18px;left:50%;transform:translate(-50%,-20px);display:flex;align-items:center;gap:10px;max-width:min(620px,90vw);padding:10px 12px 10px 16px;border-radius:14px;background:#fff;border:1px solid #d9d0f3;box-shadow:0 12px 36px rgba(60,40,120,.18);font-size:13.5px;opacity:0;pointer-events:none;transition:.25s ease;z-index:9999}
  .ui-suggest.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .ui-suggest span{flex:1}
  .ui-sg-ok{border:0;background:#8a74d0;color:#fff;border-radius:8px;padding:5px 12px;font-weight:600;cursor:pointer}
  .ui-sg-no{border:0;background:#f3f1f8;color:#6b6780;border-radius:8px;padding:5px 12px;cursor:pointer}

  /* ===== P4 time-of-day order + P3 streaming ===== */
  .tod-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;padding:7px 12px;border-radius:12px;background:#f6f4fb;color:#5d5876;font-size:12.5px}
  .tod-strip .tod-text{flex:1;min-width:200px}
  .tod-btn{border:0;background:#fff;color:#4b3a86;border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer;box-shadow:0 1px 3px rgba(40,30,90,.08)}
  .why-line{margin-top:10px;font-size:11.5px;color:#7a5cc4;background:#f4f0fc;border-radius:8px;padding:4px 9px;display:inline-block}
  .ui-held{position:fixed;bottom:92px;left:50%;transform:translate(-50%,10px);padding:7px 14px;border-radius:999px;background:#2f2a45;color:#fff;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:9999}
  .ui-held.show{opacity:.95;transform:translate(-50%,0)}
  .bubble.streaming{white-space:pre-wrap}
  .bubble.streaming::after{content:'▍';margin-left:2px;color:#8a74d0;animation:typing 1s infinite}
  .z-msg.streaming{white-space:pre-wrap}
  .sf-skel{border:1px dashed #d9d0f3;border-radius:16px;padding:14px 16px;margin:8px 0;background:linear-gradient(90deg,#faf9fd 25%,#f1ecfb 50%,#faf9fd 75%);background-size:200% 100%;animation:sfShimmer 1.2s infinite linear}
  .sf-skel b{display:block;font-size:13.5px;color:#4b3a86;margin-bottom:8px}
  .sf-skel i{display:block;height:9px;border-radius:5px;background:#e9e3f7;margin:7px 0}
  @keyframes sfShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .sf-table tbody tr,.sf-list li,.sf-timeline li{animation:sfRowIn .28s ease both}
  .sf-table tbody tr:nth-child(n+4),.sf-list li:nth-child(n+4){animation-delay:.08s}
  .sf-table tbody tr:nth-child(n+8),.sf-list li:nth-child(n+8){animation-delay:.16s}
  .sf-table tbody tr:nth-child(n+12){animation-delay:.24s}
  @keyframes sfRowIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .digest-progress{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(74,108,247,.05);font-size:12.5px;color:var(--ink2)}
  .digest-progress[hidden]{display:none}
  .digest-progress .dp-chip{display:inline-flex;gap:4px;align-items:center;padding:2px 9px;border-radius:999px;background:#fff;border:1px solid var(--line)}
  .digest-progress .dp-done{color:#0a8f5a;border-color:#bfe8d4}.digest-progress .dp-bad{color:#c2410c;border-color:#fbd5bf}.digest-progress .dp-run{color:var(--blue)}
  .digest-run-box{margin:0 0 14px}.digest-run-box table{border-collapse:collapse;font-size:12.5px;width:100%}.digest-run-box td,.digest-run-box th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}

  /* Multimodal composer: attachments preview + mic */
  .composer-attach{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px 8px;max-width:640px;margin:0 auto}
  .composer-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--ink2);max-width:100%}
  .composer-chip img{width:36px;height:36px;object-fit:cover;border-radius:8px;background:#eee}
  .composer-chip .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
  .composer-chip .x{border:0;background:transparent;color:var(--ink3);cursor:pointer;font-size:14px;padding:0 2px;line-height:1}
  .composer-chip.err{border-color:#f1b4a2;color:#c2410c;background:#fff5f0}
  .composer-tools{display:flex;gap:4px;align-items:center;flex-shrink:0}
  .composer-tools button{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--ink2);cursor:pointer;font-size:18px;display:grid;place-items:center}
  .composer-tools button:hover{background:rgba(0,0,0,.05);color:var(--ink)}
  .composer-tools button.rec{background:#fee2e2;color:#b91c1c;animation:pulse-rec 1.2s infinite}
  @keyframes pulse-rec{50%{opacity:.7}}

  .douya .dy-all{transform-origin:32px 61px}
  .douya .dy-sprout{transform-origin:32px 34px}
  .douya .dy-leaf-l{transform-origin:31.4px 22.6px}
  .douya .dy-leaf-r{transform-origin:32.6px 20.6px}
  .douya .dy-glow{transform-origin:32px 45px;opacity:.55}
  .douya .dy-shadow{transform-origin:32px 61.6px}
  .douya .dy-spark{opacity:0}
  .douya .s1{transform-origin:10px 29.4px}.douya .s2{transform-origin:54px 26.7px}.douya .s3{transform-origin:44px 10.3px}
  .douya-idle .dy-all{animation:dy-breathe 4.2s ease-in-out infinite}
  .douya-idle .dy-shadow{animation:dy-shadow 4.2s ease-in-out infinite}
  .douya-idle .dy-leaf-l{animation:dy-sway-l 3.8s ease-in-out infinite}
  .douya-idle .dy-leaf-r{animation:dy-sway-r 3.8s ease-in-out -1.9s infinite}
  .douya-idle .dy-sheen{animation:dy-sheen 5.5s ease-in-out 1s infinite}
  .douya-idle .dy-glow{animation:dy-glow 4.2s ease-in-out infinite}
  .douya-think .dy-all{animation:dy-hop 1.2s cubic-bezier(.35,0,.25,1) infinite}
  .douya-think .dy-shadow{animation:dy-shadow-hop 1.2s cubic-bezier(.35,0,.25,1) infinite}
  .douya-think .dy-sprout{animation:dy-grow 1.2s ease-in-out infinite}
  .douya-think .dy-leaf-l{animation:dy-flut-l .32s ease-in-out infinite alternate}
  .douya-think .dy-leaf-r{animation:dy-flut-r .32s ease-in-out -.16s infinite alternate}
  .douya-think .dy-sheen{animation:dy-sheen 1.6s ease-in-out infinite}
  .douya-think .dy-glow{animation:dy-glow 1.2s ease-in-out infinite}
  .douya-think .dy-spark{animation:dy-spark 1.5s ease-in-out infinite}
  .douya-think .s2{animation-delay:.5s}.douya-think .s3{animation-delay:1s}
  .douya:hover .dy-all,.douya-hover .dy-all{animation:dy-bounce .7s cubic-bezier(.3,1.6,.5,1) 1}
  @keyframes dy-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
  @keyframes dy-shadow{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  @keyframes dy-sway-l{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}}
  @keyframes dy-sway-r{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
  @keyframes dy-sheen{0%{transform:skewX(-22deg) translateX(0)}35%,100%{transform:skewX(-22deg) translateX(92px)}}
  @keyframes dy-glow{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:.75;transform:scale(1.04)}}
  @keyframes dy-hop{0%,100%{transform:translateY(0) scale(1,1)}22%{transform:translateY(0) scale(1.05,.94)}45%{transform:translateY(-4px) scale(.97,1.04)}70%{transform:translateY(0) scale(1.03,.97)}}
  @keyframes dy-shadow-hop{0%,100%,22%,70%{transform:scale(1);opacity:1}45%{transform:scale(.8);opacity:.6}}
  @keyframes dy-grow{0%,100%{transform:scaleY(1) rotate(-2deg)}50%{transform:scaleY(1.16) rotate(2deg)}}
  @keyframes dy-flut-l{from{transform:rotate(8deg)}to{transform:rotate(-14deg)}}
  @keyframes dy-flut-r{from{transform:rotate(-8deg)}to{transform:rotate(14deg)}}
  @keyframes dy-spark{0%,100%{opacity:0;transform:scale(.3) rotate(0)}40%{opacity:1;transform:scale(1.1) rotate(45deg)}70%{opacity:0;transform:scale(.6) rotate(90deg)}}
  @keyframes dy-bounce{0%{transform:translateY(0)}35%{transform:translateY(-5px) scale(.97,1.04)}70%{transform:translateY(0) scale(1.04,.96)}100%{transform:none}}
