    const freeMin = Math.max(0, (Math.min(hi, 23 * 60) - nowM) - blocks.filter(b => b.e > nowM).reduce((s, b) => s + (b.e - Math.max(b.s, nowM)), 0));
    const note = upcoming
      ? `接下来 ${escapeHtml(upcoming.start)} ${(() => { const t = ttTitle(upcoming.title), c = CAT_ZH[upcoming.category] || ''; return escapeHtml(c && !t.startsWith(c) ? c + '：' + t : t); })()}`
      : `今天的安排都已过去，剩余约 ${(freeMin / 60).toFixed(1)} 小时空闲，适合收尾或复盘。`;
    return `
      <section class="myday" data-sys="timetable">
        <div class="myday-head">
          <div>
            <div class="eyebrow c-teal">我的一天 · MY DAY</div>
            <div class="myday-note">${note}</div>
          </div>
          <div class="myday-meta"><span><b>${fixedN}</b> 个固定日程</span><span><b>${blocks.length - fixedN}</b> 个建议时段</span><span>现在 <b>${fmtMin(nowM)}</b></span></div>
        </div>
        <div class="tt">
          <div class="tt-track" style="height:${nLanes * laneH + 6}px">${bars || '<div class="tt-empty">今天还没有日程，连接日历后会自动排进来</div>'}
            ${nowM >= lo && nowM <= hi ? `<div class="tt-now" style="left:${pct(nowM)}%"><em>${fmtMin(nowM)}</em></div>` : ''}
          </div>
          <div class="tt-axis">${ticks}</div>
        </div>
      </section>`;
  }

  function ringSvg(value, max, color, size = 64, stroke = 7) {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r;
    const p = max > 0 ? Math.min(value / max, 1) : 0;
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(30,40,80,.08)" stroke-width="${stroke}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c - p * c}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>`;
  }

  function renderHero(hero, work) {
    const urgent = work.filter(c => c.priority === 'urgent' || c.priority === 'high');
    const totPR = work.reduce((s, c) => s + statOf(c, 'PR'), 0);
    const totIss = work.reduce((s, c) => s + statOf(c, 'issue'), 0);
    const focus = [...work].sort((a, b) => (b.priority === 'high') - (a.priority === 'high') || (statOf(b, 'PR') + statOf(b, 'issue')) - (statOf(a, 'PR') + statOf(a, 'issue'))).slice(0, 3);
    const rings = (blockOf(hero || {}, 'achievement-rings') || {}).rings || [];
    const lead = work.length
      ? `${work.length} 个项目在推进，其中 ${urgent.length} 个需要优先关注。按下面的顺序来，一件件收掉。`
      : '今天没有待推进的事项，点「立即汇聚」拉取最新动态。';
    return `
      <div class="tile hero2 size-hero" data-sys="hero">
        <div class="eyebrow c-violet">今日焦点 · 豆芽建议</div>
        <p class="hero-lead">${escapeHtml(lead)}</p>
        <ol class="focus">
          ${focus.map((c, i) => {
            const r = repoOf(c);
            return `<li data-focus="${escapeHtml(c.id)}"><span class="focus-n">${i + 1}</span><div class="focus-b"><b>${escapeHtml(r ? r.name : clip(c.title, 24))}</b><span>${escapeHtml(nextAction(c))}</span></div><span class="focus-go">→</span></li>`;
          }).join('')}
        </ol>
        <div class="hero-foot">
          <div class="hero-kpi"><b>${totPR}</b><span>PR 待推进</span></div>
          <div class="hero-kpi"><b>${totIss}</b><span>issue 待处理</span></div>
          ${rings.map(r => `<div class="hero-ring" title="${escapeHtml(r.label)} ${r.value}/${r.max}">${ringSvg(r.value, r.max, r.color, 44, 5)}<div><b>${r.value}<small>/${r.max}</small></b><span>${escapeHtml(r.label)}</span></div></div>`).join('')}
        </div>
      </div>`;
  }

  function renderLoad(work) {
    const rows = work.map(c => ({ c, r: repoOf(c), pr: statOf(c, 'PR'), iss: statOf(c, 'issue') }))
      .filter(x => x.pr + x.iss > 0)
      .sort((a, b) => (b.pr + b.iss) - (a.pr + a.iss)).slice(0, 7);
    if (!rows.length) return '';
    const max = Math.max(...rows.map(x => x.pr + x.iss), 1);
    const scale = v => { const a=Math.log10(v+1), b=Math.log10(max+1); return Math.max(6, (a/b)*100); };
    return `
      <div class="tile load size-load" data-sys="load">
        <div class="eyebrow c-blue">工作负载 · 按项目</div>
        <p class="load-desc">每个项目还挂着多少 PR 和 issue（长度按平方根缩放，避免大仓库压扁小仓库）。点一行看详情。</p>
        <div class="load-rows">
          ${rows.map(x => `
            <div class="load-row" data-focus="${escapeHtml(x.c.id)}">
              <span class="load-name" title="${escapeHtml(x.r ? x.r.owner + '/' + x.r.name : x.c.title)}">${escapeHtml(x.r ? x.r.name : clip(x.c.title, 18))}</span>
              <span class="load-bar"><i class="b-pr" style="width:${scale(x.pr + x.iss) * (x.pr / (x.pr + x.iss))}%"></i><i class="b-iss" style="width:${scale(x.pr + x.iss) * (x.iss / (x.pr + x.iss))}%"></i></span>
              <span class="load-val">${x.pr ? `<em class="v-pr">${x.pr}</em>` : ''}${x.iss ? `<em class="v-iss">${x.iss}</em>` : ''}</span>
            </div>`).join('')}
        </div>
        <div class="legend"><span><i class="b-pr"></i>你开的 / 待推进 PR</span><span><i class="b-iss"></i>待处理 issue</span><span style="margin-left:auto;opacity:.7">长度按对数缩放</span></div>
      </div>`;
  }

  function renderWorkTile(card, idx) {
    const r = repoOf(card);
    const pr = statOf(card, 'PR'), iss = statOf(card, 'issue');
    const big = card.priority === 'high' || card.priority === 'urgent';
    const desc = explain(card) || zhBody(card);
    const links = deepLinks(card);
    const spark = blockOf(card, 'sparkline');
    const hasSpark = spark && (spark.data || []).some(v => v > 0);
    const label = SRC_ZH[card.source] || (card.source || '动态');
    const av = r ? `<img class="av" src="https://github.com/${encodeURIComponent(r.owner)}.png?size=80" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'av av-f',textContent:'${escapeHtml(r.owner.slice(0, 1).toUpperCase())}'}))">` : `<span class="av av-f">${escapeHtml((card.source || '?').slice(0, 1).toUpperCase())}</span>`;
    const review = statOf(card, '待你审') || statOf(card, '审');
    const mine = statOf(card, '你开的') || pr;
    let metrics = '';
    if (review || mine || iss) {
      metrics = `<div class="metrics">
        ${review ? `<div class="m"><b class="c-rose">${review}</b><span>待你审</span></div>` : ''}
        ${mine ? `<div class="m"><b class="c-teal">${mine}</b><span>你开的 PR</span></div>` : ''}
        ${iss ? `<div class="m"><b class="c-violet">${iss}</b><span>待处理 issue</span></div>` : ''}
        <div class="m-bar"><i class="b-pr" style="flex:${Math.max(mine||pr,0)}"></i><i class="b-iss" style="flex:${Math.max(iss,0)}"></i></div>
      </div>`;
    }
    const bar = (card.blocks || []).find(b => b.type === 'chart' && b.chartType === 'bar');
    if (bar && (bar.data || []).some(v => v > 0)) {
      const mx = Math.max(...bar.data, 1);
      metrics += `<div class="mini-bars" title="等你 vs 等别人">${(bar.data||[]).map((v,i)=>`<div class="mb"><i style="height:${Math.max(8,(v/mx)*36)}px" class="${i===0?'b-pr':'b-iss'}"></i><span>${escapeHtml((bar.labels||[])[i]||'')}<b>${v}</b></span></div>`).join('')}</div>`;
    }
    const tags = ((card.blocks || []).find(b => b.type === 'tags') || {}).tags || [];
    const avatars = (blockOf(card, 'avatars') || {}).urls || [];
    const avRow = avatars.length ? `<div class="av-row">${avatars.slice(0,5).map(u=>`<img class="av sm" src="${escapeHtml(u)}" alt="" loading="lazy" onerror="this.style.display='none'"/>`).join('')}</div>` : '';
    const tagHtml = tags.length ? `<div class="w-tags">${tags.map(t=>{const tx=TAG_ZH[t.text]||t.text; return `<span class="pill pill-${escapeHtml(t.color||'gray')}">${escapeHtml(tx)}</span>`;}).join('')}</div>` : '';
    if (hasSpark) {
      const d = spark.data, mx = Math.max(...d, 1);
      const pts = d.map((v, i) => `${(i / (d.length - 1)) * 100},${30 - (v / mx) * 26}`).join(' ');
      metrics += `<svg class="spark" viewBox="0 0 100 32" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
    }
    return `
      <article class="tile work ${big ? 'size-wide' : 'size-normal'}" data-idx="${idx}">
        <header class="w-top">
          ${av}
          <div class="w-src"><span class="w-label">${escapeHtml(label)}</span><span class="w-repo">${escapeHtml(r ? `${r.owner} / ${r.name}` : (card.subtitle || ''))}</span></div>
          ${big ? '<span class="pill pill-hot">优先</span>' : ''}${tagHtml}
        </header>
        <h3 class="w-head">${escapeHtml(headline(card))}</h3>
        ${desc ? `<p class="w-desc">${escapeHtml(desc)}</p>` : ''}
        ${metrics}${avRow}
        <div class="w-next"><span class="w-next-k">下一步</span><span class="w-next-v">${escapeHtml(nextAction(card))}</span></div>
        <div class="w-links">${links.map(linkRow).join('')}</div>
      </article>`;
  }

  function renderCardList(cards) {
    const container = $('cardList');
    lastCards = cards;
    const hero = cards.find(c => c.type === 'hero');
    const tt = cards.find(c => c.type === 'timetable');
    const work = cards.filter(c => !SYS_TYPES.has(c.type));
    const order = [...work].sort((a, b) => ((b.priority === 'high') - (a.priority === 'high')));
    let html = tt ? renderTimetable(tt) : '';
    html += '<div class="grid2">';
    html += renderHero(hero, work);
    html += renderLoad(work);
    html += order.map(c => renderWorkTile(c, cards.indexOf(c))).join('');
    if (!work.length) html += `<div class="tile empty size-wide"><div class="eyebrow">还没有卡片</div><p class="w-desc">点击右上角「立即汇聚」，豆芽会从已连接的数据源拉取最新动态。</p></div>`;
    html += '</div>';
    html += `<div class="today-chat-input"><div class="input-wrap"><input type="text" id="todayChatInput" placeholder="问豆芽：今天先做哪件？帮我总结一下…" /><button class="send-btn" id="todayChatSend">↑</button></div></div>`;
    const prevAsk = $('todayChatInput') ? $('todayChatInput').value : '';
    const hadFocus = document.activeElement && document.activeElement.id === 'todayChatInput';
    container.innerHTML = html;
    if (prevAsk) $('todayChatInput').value = prevAsk;
    if (hadFocus) $('todayChatInput').focus();

    const track = async (card, action) => {
      if (!card || !card.id) return;
      try { await fetch(`/api/cards/${card.id}/interact`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action }) }); } catch (e) { console.warn('[Interaction] Track failed:', e); }
    };
    container.querySelectorAll('.tile.work').forEach(tile => {
      const card = cards[Number(tile.getAttribute('data-idx'))];
      tile.addEventListener('click', e => {
        if (e.target.closest('a')) { track(card, 'open'); return; }
        track(card, 'open');
        openTileZoom(card);
      });
    });
    container.querySelectorAll('[data-focus]').forEach(el => {
      el.addEventListener('click', e => {
        e.stopPropagation();
        const card = cards.find(c => c.id === el.getAttribute('data-focus'));
        if (card) { track(card, 'open'); openTileZoom(card); }
      });
    });
    const myday = container.querySelector('.myday');
    if (myday && tt) myday.addEventListener('click', () => openTileZoom(tt));
    setupTodayChatInput();
  }


  function openDock() {
    $('dockPanel').classList.add('open');
    $('dockBtn').classList.remove('has');
  }

  function setupTodayChatInput() {
    const input = $('todayChatInput');
    const sendBtn = $('todayChatSend');
    
    if (!input || !sendBtn) return;
    
    const send = () => {
      const msg = input.value.trim();
      if (!msg) return;
      
      // Open dock and send message
      input.value = '';
      openDock();
      $('dockInput').value = msg;
      sendMessage();
    };
    
    sendBtn.onclick = send;
    input.onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    };
  }

  // Manual digest generation
  async function generateDigest() {
    const btn = $('generateDigestBtn');
    const status = $('digestStatus');
    
    btn.disabled = true;
    btn.textContent = '汇聚中...';
    status.textContent = '正在获取数据...';
    status.style.color = 'var(--blue)';
    
    try {
      const res = await fetch('/api/digest/generate', { method: 'POST' });
      const result = await res.json();
      
      if (!result.success) {
        status.textContent = '⚠️ ' + (result.error || '汇聚失败');
        status.style.color = 'var(--red)';
        btn.textContent = '⚡ 立即汇聚';
        btn.disabled = false;
        return;
      }
      
      status.textContent = `✓ 已汇聚 ${result.newCardCount} 张新卡片`;
      status.style.color = 'var(--green)';
      btn.textContent = '⚡ 重新汇聚';
      btn.disabled = false;
      
      // Reload today page
      await loadToday();
    } catch (err) {
      console.error('Failed to generate digest:', err);
      status.textContent = '⚠️ 生成失败';
      status.style.color = 'var(--red)';
      btn.textContent = '⚡ 立即汇聚';
      btn.disabled = false;
    }
  }

    const groups = {};
    apps.forEach(a => { (groups[a.category || '其他'] = groups[a.category || '其他'] || []).push(a); });
    const authZh = { OAUTH2: 'OAuth 授权', OAUTH1: 'OAuth 授权', API_KEY: '需 API Key', NO_AUTH: '无需授权' };
    return Object.entries(groups).map(([cat, list]) => {
      const n = list.filter(a => a.connected).length;
      return `<section class="src-group"><div class="src-group-h"><b>${escapeHtml(cat)}</b><span>${n ? `${n}/${list.length} 已连接` : `${list.length} 个可连接`}</span></div>
      <div class="src-grid">${list.map(a => {
        const st = a.connected ? ['on', '已连接'] : a.pending ? ['wait', '授权中'] : ['off', '未连接'];
        return `<div class="src-tile ${a.connected ? 'is-on' : ''}">
          <div class="src-top"><img src="${escapeHtml(a.logo)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'src-fb',textContent:'${escapeHtml(a.name.charAt(0))}'}))"><span class="src-pill ${st[0]}">${st[1]}</span></div>
          <h4>${escapeHtml(a.name)}</h4>
          <p>${escapeHtml(a.description || '')}</p>
          <div class="src-foot"><span class="src-auth">${authZh[a.authMode] || ''}</span>
          <button class="src-btn ${a.connected ? 'ghost' : ''}" onclick="handleAppAction('${escapeHtml(a.key)}', ${a.connected ? 'true' : 'false'})">${a.connected ? '断开' : '连接'}</button></div>
        </div>`;
      }).join('')}</div></section>`;
    }).join('');

  async function loadSources() {
    const content = $('sourcesContent');
    content.innerHTML = '<div class="loading">加载中...</div>';
    try {
      const res = await fetch('/api/composio/apps');
      const data = await res.json();
      const apps = data.apps || [];
      const on = apps.filter(a => a.connected).length;
      content.innerHTML = `<div class="src-summary"><div><b>${on}</b><span>已连接</span></div><div><b>${apps.length}</b><span>可用信源</span></div>${data.configured ? '' : '<p class="src-warn">尚未配置 Composio API Key，请先到「配置」页填写后再连接。</p>'}</div>` + renderAppTiles(apps);

      console.error('Failed to load sources:', err);

  // LLM Settings handlers
  async function loadLLMSettings() {
    try {
      const res = await fetch('/api/llm/config');
      const data = await res.json();
      
      if (data.provider) {
        $('llmProviderSelect').value = data.provider;
        handleProviderChange();
      }
      if (data.baseURL) $('llmBaseURLInput').value = data.baseURL;
      if (data.model) $('llmModelInput').value = data.model;
      if (data.apiKey) {
        $('llmApiKeyInput').placeholder = data.apiKey;
        $('llmApiKeyInput').value = '';
      }
    } catch (error) {
      console.error('Failed to load LLM settings:', error);
    }
  }

  const PROVIDER_PRESETS = {
    openai: { baseURL: 'https://api.openai.com/v1', model: 'gpt-4o' },
    deepseek: { baseURL: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
    moonshot: { baseURL: 'https://api.moonshot.cn/v1', model: 'moonshot-v1-8k' },
    zhipu: { baseURL: 'https://open.bigmodel.cn/api/paas/v4', model: 'glm-4' },
    anthropic: { baseURL: 'https://api.anthropic.com/v1', model: 'claude-3-5-sonnet-20241022' },
  };

  function handleProviderChange() {
    const provider = $('llmProviderSelect').value;
    const baseURLDiv = $('llmBaseURLDiv');
    const baseURLInput = $('llmBaseURLInput');
    const modelInput = $('llmModelInput');

    if (provider === 'custom') {
      baseURLDiv.style.display = 'block';
      baseURLInput.value = '';
      modelInput.placeholder = '输入模型名称';
    } else if (PROVIDER_PRESETS[provider]) {
      const preset = PROVIDER_PRESETS[provider];
      baseURLDiv.style.display = 'none';
      baseURLInput.value = preset.baseURL;
      if (!modelInput.value || modelInput.value === modelInput.placeholder) {
        modelInput.value = preset.model;
      }
      modelInput.placeholder = preset.model;
    } else {
      baseURLDiv.style.display = 'none';
    }
  }

  const llmProviderSelect = $('llmProviderSelect');
  if (llmProviderSelect) {
    llmProviderSelect.addEventListener('change', handleProviderChange);
  }

  const saveLLMBtn = $('saveLLMBtn');
  if (saveLLMBtn) {
    saveLLMBtn.addEventListener('click', async () => {
      const provider = $('llmProviderSelect').value;
      const baseURL = $('llmBaseURLInput').value;
      const apiKey = $('llmApiKeyInput').value;
      const model = $('llmModelInput').value;

      if (!provider) {
        $('llmStatus').innerHTML = '<span style="color:var(--red)">请选择提供商</span>';
        return;
      }
      if (!apiKey && !$('llmApiKeyInput').placeholder.includes('...')) {
        $('llmStatus').innerHTML = '<span style="color:var(--red)">请输入 API Key</span>';
        return;
      }

      $('llmStatus').innerHTML = '<span style="color:var(--ink3)">保存中...</span>';
      
      try {
        const payload = { provider, baseURL, model };
        if (apiKey) payload.apiKey = apiKey;
        
        const res = await fetch('/api/llm/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        
        const result = await res.json();
        
        if (result.success) {
          $('llmStatus').innerHTML = '<span style="color:var(--green)">✓ 保存成功，模型已更新</span>';
          if (result.masked) {
            $('llmApiKeyInput').placeholder = result.masked;
            $('llmApiKeyInput').value = '';
          }
        } else {
          $('llmStatus').innerHTML = `<span style="color:var(--red)">保存失败: ${result.error}</span>`;
        }
      } catch (error) {
        $('llmStatus').innerHTML = `<span style="color:var(--red)">保存失败: ${error.message}</span>`;
      }
    });
  }

  const testLLMBtn = $('testLLMBtn');
  if (testLLMBtn) {
    testLLMBtn.addEventListener('click', async () => {
      $('llmStatus').innerHTML = '<span style="color:var(--ink3)">测试中...</span>';
      
      try {
        const res = await fetch('/api/llm/test', { method: 'POST' });
        const result = await res.json();
        
        if (result.ok) {
          $('llmStatus').innerHTML = `<span style="color:var(--green)">✓ 连接成功！<br>回复: ${escapeHtml(result.response)}</span>`;
        } else {
          let errorHtml = `<span style="color:var(--red)">✗ ${escapeHtml(result.error)}`;
          if (result.status) {
            errorHtml += `<br><small style="color:var(--ink3)">HTTP ${result.status}</small>`;
          }
          if (result.body && result.body.length > 0) {
            const shortBody = result.body.slice(0, 200);
            errorHtml += `<br><small style="color:var(--ink3);font-family:monospace;font-size:10px">${escapeHtml(shortBody)}${result.body.length > 200 ? '...' : ''}</small>`;
          }
          errorHtml += '</span>';
          $('llmStatus').innerHTML = errorHtml;
        }
      } catch (error) {
        $('llmStatus').innerHTML = `<span style="color:var(--red)">测试失败: ${error.message}</span>`;
      }
    });
  }

  // Composio Settings
  async function loadComposioSettings() {
    try {
      // Load config
      const cfgRes = await fetch('/api/composio/config');
      const cfg = await cfgRes.json();
      
      if (cfg.apiKeyMasked) {
        $('apiKeyInput').placeholder = cfg.apiKeyMasked;
        $('apiKeyInput').value = '';
      }
      if (cfg.entityId) {
        $('entityIdInput').value = cfg.entityId;
      }

      // Load apps
      const appsRes = await fetch('/api/composio/apps');
      const appsData = await appsRes.json();
      
      const grid = $('appsGrid');
      grid.className = '';
      grid.innerHTML = (appsData.apps && appsData.apps.length) ? renderAppTiles(appsData.apps) : '<p style="color:var(--ink3);padding:20px;text-align:center">暂无可用应用</p>';
    } catch (error) {
      console.error('Failed to load Composio settings:', error);
    }
  }

  // Save Composio API Key
  const saveApiKeyBtn = $('saveApiKeyBtn');
  if (saveApiKeyBtn) {
    saveApiKeyBtn.addEventListener('click', async () => {
      const apiKey = $('apiKeyInput').value;
      const entityId = $('entityIdInput').value || 'default';

      if (!apiKey && !$('apiKeyInput').placeholder.includes('...')) {
        $('apiKeyStatus').innerHTML = '<span style="color:var(--red)">请输入 API Key</span>';
        return;
      }

      $('apiKeyStatus').innerHTML = '<span style="color:var(--ink3)">保存中...</span>';
      
      try {
        const payload = { entityId };
        if (apiKey) payload.apiKey = apiKey;
        
        const res = await fetch('/api/composio/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        
        const result = await res.json();
        
        if (result.success) {
          $('apiKeyStatus').innerHTML = '<span style="color:var(--green)">✓ 保存成功</span>';
          if (result.apiKeyMasked) {
            $('apiKeyInput').placeholder = result.apiKeyMasked;
            $('apiKeyInput').value = '';
          }
          // Reload apps to get connection status
          setTimeout(() => loadComposioSettings(), 500);
        } else {
          $('apiKeyStatus').innerHTML = `<span style="color:var(--red)">保存失败: ${escapeHtml(result.error)}</span>`;
        }
      } catch (error) {
        $('apiKeyStatus').innerHTML = `<span style="color:var(--red)">保存失败: ${error.message}</span>`;
      }
    });
  }

  // Handle app connect/disconnect
  window.handleAppAction = async function(appKey, isConnected) {
    if (isConnected) {
      // Disconnect
      if (!confirm(`确定要断开 ${appKey} 的连接吗？`)) return;
      
      try {
        const res = await fetch('/api/composio/disconnect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ appKey }),
        });
        const result = await res.json();
        if (result.success) {
          alert('已断开连接');
          loadComposioSettings(); window.__reloadSources && window.__reloadSources();
        } else {
          alert('断开失败: ' + result.error);
        }
      } catch (error) {
        alert('断开失败: ' + error.message);
      }
    } else {
      // Connect via OAuth
      try {
        const res = await fetch('/api/composio/connect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ appKey }),
        });
        const result = await res.json();
        const authUrl = result.redirectUrl || result.authUrl;
        if (authUrl) {
          // Open OAuth in new window
          window.open(authUrl, '_blank', 'width=600,height=700');
          // Poll for connection status (3 attempts over 6 seconds)
          let attempts = 0;
          const pollInterval = setInterval(() => {
            attempts++;
            loadComposioSettings(); window.__reloadSources && window.__reloadSources();
            if (attempts >= 3) {
              clearInterval(pollInterval);
            }
          }, 2000);
        } else {
          alert('连接失败: ' + (result.error || '未知错误'));
        }
      } catch (error) {
        alert('连接失败: ' + error.message);
      }
    }
  };

  // Check config
  async function checkConfig() {
    try {
      const res = await fetch('/api/config/check');
      const data = await res.json();
      const status = $('configStatus') || { innerHTML: '' };
      const llmStatus = $('llmStatus') || { innerHTML: '' };
      
      if (data.configured) {
        status.innerHTML = '<span style="color:var(--green)">✓ 已配置</span>';
      } else {
        status.innerHTML = '<span style="color:var(--amber)">⚠ 未配置或配置不完整</span>';
      }
      
      if (data.llmConfigured) {
        llmStatus.innerHTML = '<span style="color:var(--green)">✓ 已配置</span>';
      } else {
        llmStatus.innerHTML = '<span style="color:var(--red)">✗ 未配置（聊天功能受限）</span>';
      }
    } catch (err) {
      if ($('configStatus')) $('configStatus').innerHTML = '<span style="color:var(--red)">检查失败</span>';
      if ($('llmStatus')) $('llmStatus').innerHTML = '<span style="color:var(--red)">检查失败</span>';
    }
  }

  // Manual digest push
  const pushBtn = $('pushDigestBtn');
  if (pushBtn) {
    pushBtn.addEventListener('click', async () => {
      pushBtn.disabled = true;
      pushBtn.textContent = '推送中...';
      try {
        const res = await fetch('/api/digest/push', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          alert(`推送成功！已发送 ${data.deliveries?.length || 0} 条消息`);
        } else {
          alert(`推送失败：${data.error}`);
        }
      } catch (err) {
        alert('推送失败：' + err.message);
      } finally {
        pushBtn.disabled = false;
        pushBtn.textContent = '手动推送汇聚';
      }
    });
  }

  // Tile zoom modal functions
  let currentZoomCard = null;
  
  function openTileZoom(card) {
    currentZoomCard = card;
    const overlay = $('tileZoomOverlay');
    const title = $('zoomTitle');
    const subtitle = $('zoomSubtitle');
    const content = $('zoomContent');
    if (!overlay || !title || !subtitle || !content) return;
    const r = repoOf(card);
    const isTT = card.type === 'timetable';
    title.textContent = isTT ? '我的一天' : headline(card);
    subtitle.innerHTML = isTT ? '今天的固定日程与豆芽建议的时段' :
      `<span class="z-src">${escapeHtml(SRC_ZH[card.source] || card.source || '')}</span>${r ? ` · <a href="${escapeHtml(card.url)}" target="_blank" rel="noopener">${escapeHtml(r.owner + ' / ' + r.name)}</a>` : ''}`;
    let html = '';
    if (isTT) {
      const tt = blockOf(card, 'timetable') || {};
      const all = [...(tt.fixedBlocks || []), ...(tt.suggestedBlocks || [])].sort((a, b) => (toMin(a.start) || 0) - (toMin(b.start) || 0));
      html += `<div class="z-sec"><h4>时间表</h4><div class="z-items">${all.map(b => `<div class="z-item"><span class="z-time">${escapeHtml(b.start)}–${escapeHtml(b.end)}</span><div class="z-item-b"><b>${escapeHtml(b.title)}</b><span>${escapeHtml(CAT_ZH[b.category] || (b.type === 'suggested' ? '建议' : '日程'))}</span></div></div>`).join('') || '<p class="w-desc">暂无日程</p>'}</div></div>`;
    } else {
      if (card.body) html += `<p class="z-body">${escapeHtml(zhBody(card))}</p>`;
      if (card.title && card.title !== headline(card) && !(r && card.title.toLowerCase() === r.name.toLowerCase())) html += `<p class="z-orig">原始摘要：${escapeHtml(card.title)}</p>`;
      const pr = statOf(card, 'PR'), iss = statOf(card, 'issue');
      if (pr || iss) html += `<div class="z-kpis">${pr ? `<div><b class="c-teal">${pr}</b><span>待推进 PR</span></div>` : ''}${iss ? `<div><b class="c-violet">${iss}</b><span>待处理 issue</span></div>` : ''}</div>`;
      const dl = deepLinks(card);
      html += `<div class="z-next"><div><span class="w-next-k">下一步</span><b>${escapeHtml(nextAction(card))}</b></div>${dl[0] ? `<a class="z-btn" href="${escapeHtml(dl[0].url)}" target="_blank" rel="noopener">去处理 ↗</a>` : ''}</div>`;
      const links = linksOf(card);
      if (links.length) {
        html += `<div class="z-sec"><h4>相关条目 · ${links.length}</h4><div class="z-items">`;
        links.forEach(link => {
          const k = linkKind(link);
          html += `<div class="z-item"><span class="lk-ic lk-${k.k}">${ICON[k.k] || ICON.link}</span><div class="z-item-b"><b title="${escapeHtml(link.title)}">${escapeHtml(link.title)}</b><span>${k.zh}</span></div>
            <div class="z-acts"><a class="z-act" href="${escapeHtml(link.url)}" target="_blank" rel="noopener">打开</a><button class="z-act done" data-item-url="${escapeHtml(link.url)}">完成</button><button class="z-act dismiss" data-item-url="${escapeHtml(link.url)}">忽略</button></div></div>`;
        });
        html += '</div></div>';
      }
    }
    const name = r ? r.name : (isTT ? '今天的安排' : clip(card.title, 20));
    const FALLBACK_SUGG = {
      github: ['这些 PR 现在卡在哪？', '帮我起草一条催 review 的评论', '今天只做一件事的话，做哪件？'],
      gmail: ['这些邮件里哪封需要我回复？', '帮我起草一条回复', '哪些可以直接归档？'],
      slack: ['这个频道今天在讨论什么？', '有没有需要我回应的消息？', '帮我起草一条回复'],
    };
    const sugg = isTT ? ['帮我把今晚剩下的时间排一下', '明天上午留两小时专注，放哪里？'] :
      (Array.isArray(card.suggestedQuestions) && card.suggestedQuestions.length ? card.suggestedQuestions : (FALLBACK_SUGG[card.source] || ['帮我总结一下这张卡片', '下一步我该做什么？', '这件事有多紧急？']));
    html += `
      <div class="z-chat">
        <h4>继续这个任务 · 和豆芽聊「${escapeHtml(name)}」</h4>
        <div class="z-msgs" id="zoomMsgs"></div>
        <div class="z-sugg">${sugg.map(s => `<button class="z-chip">${escapeHtml(s)}</button>`).join('')}</div>
        <div class="z-input"><input type="text" id="zoomChatInput" placeholder="关于「${escapeHtml(name)}」，问我或让我去做…" /><button id="zoomChatSend">发送</button></div>
      </div>`;
    content.innerHTML = html;

    const msgs = $('zoomMsgs');
    const chatInput = $('zoomChatInput');
    const ctx = isTT ? '【上下文：我今天的时间表】' : `【上下文：${r ? r.owner + '/' + r.name : ''} — ${card.title}。${card.body || ''} 相关链接：${linksOf(card).map(l => l.title + ' ' + l.url).join('；')}】`;
    let first = true;
    const push = (cls, text) => { const d = document.createElement('div'); d.className = 'z-msg ' + cls; d.textContent = text; msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d; };
    const sendZoomChat = async (preset) => {
      const msg = (preset || chatInput.value).trim();
      if (!msg) return;
      chatInput.value = '';
      push('me', msg);
      const typing = push('bot typing', '豆芽正在想…');
      try {
        const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: first ? `${ctx}\n${msg}` : msg, sessionId: `card-${card.id || 'x'}` }) });
        first = false;
        const data = await res.json();
        typing.remove();
        push('bot', data.text || data.error || '收到了，但模型没有返回内容。');
      } catch (err) {
        typing.remove();
        push('bot', '发送失败了，请稍后再试。');
      }
    };
    $('zoomChatSend').onclick = () => sendZoomChat();
    chatInput.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendZoomChat(); } };
    content.querySelectorAll('.z-chip').forEach(b => { b.onclick = () => sendZoomChat(b.textContent); });

    const mark = async (btn, action) => {
      if (!card.id) return;
      try { await fetch(`/api/cards/${card.id}/interact`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, itemUrl: btn.getAttribute('data-item-url') }) }); } catch (e) { return; }
      btn.closest('.z-item').classList.add(action === 'done' ? 'is-done' : 'is-dismissed');
      btn.textContent = action === 'done' ? '✓ 已完成' : '已忽略';
      btn.disabled = true;
    };
    content.querySelectorAll('.z-act.done').forEach(b => { b.onclick = () => mark(b, 'done'); });
    content.querySelectorAll('.z-act.dismiss').forEach(b => { b.onclick = () => mark(b, 'dismiss'); });
    overlay.classList.add('open');
    setTimeout(() => chatInput && chatInput.focus({ preventScroll: true }), 50);
  }


  function closeTileZoom() {
    const overlay = $('tileZoomOverlay');
    if (overlay) overlay.classList.remove('open');
    currentZoomCard = null;
  }
  
  // Wire up close handlers (delegated: overlay markup is after this script)
  document.addEventListener('click', (e) => {
    if (e.target.closest && e.target.closest('#tileZoomClose')) { e.preventDefault(); closeTileZoom(); return; }
    if (e.target && e.target.id === 'tileZoomOverlay') closeTileZoom();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && currentZoomCard) closeTileZoom();
  });

  // Initialize
  loadToday();
  setInterval(loadToday, 60000); // Refresh every minute
  
  // Wire up digest button
  const digestBtn = $('generateDigestBtn');
  if (digestBtn) {
    digestBtn.addEventListener('click', generateDigest);
  }
  
  // Show chat hint after 2 seconds
  setTimeout(() => {
    const hint = $('chatHint');
    if (hint) hint.style.animation = 'hintPulse 3s ease-in-out';
  }, 2000);
})();
</script>
<!-- Tile zoom modal overlay -->
<div class="tile-zoom-overlay" id="tileZoomOverlay">
  <div class="tile-zoom-modal">
    <button class="tile-zoom-close" id="tileZoomClose">✕</button>
    <div class="tile-zoom-header">
      <h2 class="tile-zoom-title" id="zoomTitle"></h2>
      <p class="tile-zoom-subtitle" id="zoomSubtitle"></p>
    </div>
    <div class="tile-zoom-content" id="zoomContent"></div>
  </div>
</div>

</body>
</html>
