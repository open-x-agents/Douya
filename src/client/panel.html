<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Digital Mate · 面板</title>
<style>
  :root { color-scheme: light dark; --line: #d8d8de; --muted: #6b6b76; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; font: 14px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-top: 24px; }
  section { border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  h2 { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .big { font-size: 30px; font-weight: 600; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 4px 0; }
  .ok { color: #1a7f37; }
  .bad { color: #cf222e; }
  code { font-size: 12px; }
</style>
</head>
<body>
  <h1>Open Digital Mate</h1>
  <div class="muted" id="day">读取中…</div>

  <div class="grid">
    <section>
      <h2>日报提交率</h2>
      <div class="big" id="rate">–</div>
      <div class="muted" id="rate-note">今天</div>
    </section>
    <section>
      <h2>还没交</h2>
      <ul id="missing"><li class="muted">—</li></ul>
    </section>
    <section>
      <h2>近期日程</h2>
      <ul id="upcoming"><li class="muted">—</li></ul>
    </section>
    <section>
      <h2>最近投递</h2>
      <ul id="deliveries"><li class="muted">—</li></ul>
    </section>
  </div>

<script>
const escapeHtml = value => String(value ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]))
const list = (el, items, render, empty) => {
  el.innerHTML = items.length === 0 ? `<li class="muted">${empty}</li>` : items.map(render).join('')
}
const clock = iso => String(iso ?? '').slice(11, 16) || '—'

async function refresh() {
  try {
    const response = await fetch('/api/opendigitalmate', { headers: { accept: 'application/json' } })
    if (!response.ok) throw new Error(`${response.status}`)
    const data = await response.json()
    document.getElementById('day').textContent = `更新于 ${new Date().toLocaleTimeString()}`
    const rate = data.total === 0 ? 0 : Math.round((data.submitted / data.total) * 100)
    const rateEl = document.getElementById('rate')
    rateEl.textContent = `${data.submitted}/${data.total}`
    rateEl.className = `big ${rate === 100 ? 'ok' : 'bad'}`
    document.getElementById('rate-note').textContent = `${data.today} · ${rate}%`
    list(document.getElementById('missing'), data.missing, name => `<li>${escapeHtml(name)}</li>`, '都交了')
    list(document.getElementById('upcoming'), data.upcoming,
      item => `<li>${escapeHtml(clock(item.startAt))} ${escapeHtml(item.title)}<br><span class="muted">提醒 ${escapeHtml(clock(item.fireAt))}</span></li>`,
      '没有待提醒的日程')
    list(document.getElementById('deliveries'), data.deliveries,
      item => `<li>${escapeHtml(clock(item.at.slice(11, 16)))} ${item.ok ? '<span class="ok">已送达</span>' : `<span class="bad">失败</span> ${escapeHtml(item.error ?? '')}`}</li>`,
      '还没有投递记录')
  } catch (error) {
    document.getElementById('day').textContent = `读不到面板数据：${error.message}`
  }
}

void refresh()
setInterval(refresh, 30000)
</script>
</body>
</html>
