<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Digital Mate · 面板</title>
<style>
  :root { color-scheme: light dark; --line: #d8d8de; --muted: #6b6b76; --ink: #1b1b1f; --amber: #c8862a; --amber-soft: #fff8ea; --ok: #2f9e6b; --bad: #c0392b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { padding: 32px; font: 14px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: var(--ink); }
  .page { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  section { margin-top: 26px; }
  h2 { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  h3 { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
  h4 { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  .stamp { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
  .concl { font-size: 22px; line-height: 1.35; font-weight: 600; margin: 0 0 4px; color: var(--ink); letter-spacing: 0; text-transform: none; }
  .close-line { color: var(--muted); margin: 6px 0 0; }
  .stats { display: flex; gap: 12px; margin: 16px 0 0; }
  .stat { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat b { display: block; font-size: 28px; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: 12.5px; }
  .item { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
  /* A card whose sentence can only rest on a source that is not connected gets the dashed amber
     edge: the claim itself is weaker, so the card has to look weaker. */
  .item.srcless { border: 1.5px dashed var(--amber); background: var(--amber-soft); }
  .item.no-evidence { border-style: dashed; }
  .item .due { margin: 0; color: var(--muted); font-size: 12.5px; }
  .src-note { margin: 6px 0 0; font-size: 12.5px; color: var(--amber); }
  .wait-list { margin: 0; padding-left: 18px; }
  .wait-list li { margin: 6px 0; }
  .wait-list em { color: var(--muted); font-style: normal; margin-left: 8px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); }
  .pill.ok { color: var(--ok); border-color: #c7e5cf; }
  .pill.no { color: var(--amber); border-color: #e8d3a8; }
  .src-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .src-table th { text-align: left; font-weight: 600; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .src-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .big { font-size: 30px; font-weight: 600; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 4px 0; }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
</style>
</head>
<body>
<div class="page">
  <h1>Open Digital Mate</h1>
  <!--panel:body-->
</div>
</body>
</html>
